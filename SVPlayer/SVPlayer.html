<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Video Player</title>
<style>
:root {
  --bg:#090b10; --surface:#111420; --surface2:#181c2c; --surface3:#1f2438;
  --amber:#f5a623; --amber-lo:#7a5212; --amber-hi:#ffd080;
  --text:#dde3f0; --text-dim:#586480;
  --green:#3ecf6e; --red:#f06060;
  --border:rgba(255,255,255,0.08); --r:7px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}

/* PROJECTOR */
#proj-root{display:none;background:#000;width:100vw;height:100vh;overflow:hidden;position:relative;cursor:none;}
#proj-root.active{display:block;}
#proj-layer{position:absolute;inset:0;opacity:1;}
#proj-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;}
#proj-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;}
#proj-overlay{display:none;}
#proj-black{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;}
#proj-black-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;}
#proj-start{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:pointer;}
#proj-start .ps-inner{text-align:center;}
#proj-start .ps-icon{font-size:64px;color:var(--amber);margin-bottom:16px;line-height:1;}
#proj-start .ps-text{font-size:22px;letter-spacing:.2em;color:#fff;margin-bottom:10px;}
#proj-start .ps-sub{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.1em;}

/* CONTROL */
#ctrl-root{display:none;height:100vh;overflow:hidden;flex-direction:column;}
#ctrl-root.active{display:flex;}

.top-bar{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);flex-shrink:0;}
.top-left{display:flex;align-items:center;gap:10px;padding:8px 14px;border-right:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.top-right{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);flex-wrap:wrap;justify-content:flex-end;}
.bar-title{font-size:12px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase;white-space:nowrap;}
.bar-label{font-size:11px;color:var(--text-dim);white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
.dot.ok{background:var(--green);}
.dot.err{background:var(--red);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.live-badge{font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:2px;background:rgba(62,207,110,.15);color:var(--green);border:1px solid rgba(62,207,110,.3);display:none;}
.live-badge.show{display:inline-block;}
.num-input{background:var(--surface3);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:3px 6px;border-radius:4px;outline:none;text-align:right;}
.num-input:focus{border-color:var(--amber);}

.main{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden;}

/* LEFT */
.seg-panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
.seg-list{flex:1;overflow-y:auto;padding:6px 8px;}
.seg-item{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);margin-bottom:6px;overflow:hidden;transition:border-color .15s,background .15s;}
.seg-item.is-current{border-color:var(--amber);background:rgba(245,166,35,.05);}
.seg-item.is-done{opacity:.38;}
.seg-content{flex:1;min-width:0;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
.seg-row1{display:flex;align-items:center;gap:5px;}
.seg-num{font-size:12px;color:var(--text-dim);min-width:18px;text-align:right;flex-shrink:0;font-weight:bold;}
.seg-item.is-current .seg-num{color:var(--amber);}
.seg-name-input{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);font-family:inherit;font-size:14px;font-weight:bold;padding:1px 3px;outline:none;transition:border-color .15s;min-width:0;}
.seg-name-input:focus{border-bottom-color:var(--amber);}
.seg-item.is-current .seg-name-input{color:var(--amber-hi);}
.title-badge{font-size:9px;padding:1px 5px;border-radius:2px;flex-shrink:0;background:rgba(245,166,35,.15);color:var(--amber);border:1px solid var(--amber-lo);white-space:nowrap;}
.ord-btns{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.seg-row2{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;padding-left:23px;}
.mode-sel{flex:0 0 auto;background:var(--surface3);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:10px;padding:2px 4px;border-radius:3px;outline:none;cursor:pointer;}
.folder-btn{flex:1;min-width:0;text-align:left;font-size:10px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.file-count{font-size:10px;color:var(--text-dim);flex-shrink:0;}
.file-count.ok{color:var(--green);}
.img-dur-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.img-dur-lbl{font-size:10px;color:var(--text-dim);white-space:nowrap;}
.img-num{width:36px;}
.seg-play-btn{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(245,166,35,.10);border-left:1px solid var(--amber-lo);color:var(--amber);cursor:pointer;transition:all .13s;font-family:inherit;}
.seg-play-btn:hover{background:rgba(245,166,35,.22);}
.seg-play-btn:active{transform:scale(.96);}
.seg-play-btn .pi{font-size:26px;line-height:1;}
.seg-play-btn .pl{font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;}
.seg-item.is-current .seg-play-btn{background:rgba(245,166,35,.18);border-left-color:var(--amber);color:var(--amber-hi);}

/* RIGHT */
.right-panel{display:flex;flex-direction:column;overflow:hidden;}
.monitor-row{display:flex;flex-direction:column;border-bottom:1px solid var(--border);flex-shrink:0;}
.preview-box{width:100%;aspect-ratio:16/9;position:relative;background:#000;border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;}
#preview-layer{position:absolute;inset:0;opacity:1;}
#preview-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;}
#preview-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;}
.preview-off{position:absolute;inset:0;background:#0a0c14;z-index:5;display:none;align-items:center;justify-content:center;}
.preview-off span{font-size:11px;color:var(--text-dim);}
#preview-black{position:absolute;inset:0;z-index:8;background:#000;opacity:0;pointer-events:none;}
#preview-black-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;}
.timeline-wrap{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;}
.timeline-wrap.disabled{opacity:.3;pointer-events:none;}
#timeline{flex:1;height:4px;cursor:pointer;-webkit-appearance:none;appearance:none;background:var(--surface3);border-radius:2px;outline:none;}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--amber);cursor:pointer;}
#timeline-time{font-size:10px;color:var(--text-dim);white-space:nowrap;min-width:88px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.03em;}
.now-box{padding:7px 14px;background:var(--surface);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;}
.now-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);flex-shrink:0;}
.now-name{font-size:14px;color:var(--amber);letter-spacing:.07em;min-width:0;}
.now-file{font-size:10px;color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.now-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;margin-left:5px;vertical-align:middle;}
.now-badge.vid{background:rgba(96,165,250,.15);color:#60a5fa;}
.now-badge.img{background:rgba(62,207,110,.15);color:var(--green);}
.now-badge.ttl{background:rgba(245,166,35,.15);color:var(--amber);}
.sub-area{padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.prog-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;}
.prog-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px;}
.prog-dot{height:5px;border-radius:3px;background:var(--surface3);flex:1;min-width:12px;max-width:30px;transition:background .2s;}
.prog-dot.done{background:var(--text-dim);}
.prog-dot.current{background:var(--amber);}
.shortcuts{display:flex;flex-wrap:wrap;gap:5px 12px;}
.sc{font-size:10px;color:var(--text-dim);}
.key{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--text);}
.ctrl-area{flex:1;display:flex;flex-direction:column;padding:10px 14px;gap:8px;background:var(--surface2);overflow:hidden;min-height:0;}
.ctrl-row1{display:flex;gap:8px;flex:1;min-height:0;}
.cbtn{flex:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r);background:var(--surface3);color:var(--text);font-family:inherit;cursor:pointer;transition:all .13s;font-size:22px;}
.cbtn:hover{border-color:var(--amber-lo);color:var(--amber);}
.cbtn:active{transform:scale(.96);}
.cbtn.play-btn{flex:1.5;background:var(--amber);color:#000;border-color:var(--amber);font-size:28px;}
.cbtn.play-btn:hover{background:var(--amber-hi);border-color:var(--amber-hi);}
.ctrl-row2{display:flex;gap:8px;flex:1;min-height:0;}
.seg-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--border);border-radius:var(--r);background:var(--surface3);color:var(--text-dim);font-family:inherit;cursor:pointer;transition:all .13s;font-size:20px;font-weight:bold;}
.seg-btn:not(:disabled):hover{border-color:var(--amber-lo);color:var(--amber);background:var(--surface2);}
.seg-btn:active:not(:disabled){transform:scale(.97);}
.seg-btn:disabled{opacity:.3;cursor:not-allowed;}
.seg-btn .sbl{font-size:10px;font-weight:normal;letter-spacing:.1em;text-transform:uppercase;opacity:.65;}
/* ★ SEG次ボタン: 再生中はゆっくりオレンジ点滅 */
@keyframes seg-pulse{
  0%,100%{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.12);}
  50%{border-color:var(--amber-lo);color:var(--amber-lo);background:transparent;}
}
.seg-btn.is-playing{animation:seg-pulse 2s ease-in-out infinite;}
.ctrl-row3{display:flex;gap:8px;flex:0 0 auto;}
.blackout-btn{flex:1;height:52px;font-family:inherit;font-size:15px;font-weight:bold;letter-spacing:.06em;border:2px solid #333;border-radius:var(--r);background:var(--surface3);color:var(--text-dim);cursor:pointer;transition:all .13s;display:flex;align-items:center;justify-content:center;gap:8px;}
.blackout-btn:hover{border-color:#666;color:var(--text);}
.blackout-btn:active{transform:scale(.97);}
.blackout-btn.active{background:#0a0000;border-color:var(--red);color:var(--red);}
.blackout-btn.active:hover{background:#160000;}
.bo-side{display:flex;flex-direction:column;gap:4px;}
.bo-img-btn,.bo-clear-btn{width:52px;flex:1;font-family:inherit;border:1px solid var(--border);border-radius:var(--r);background:var(--surface3);color:var(--text-dim);cursor:pointer;transition:all .13s;display:flex;align-items:center;justify-content:center;}
.bo-img-btn{font-size:18px;}
.bo-clear-btn{font-size:15px;}
.bo-img-btn:hover{border-color:var(--amber-lo);color:var(--amber);}
.bo-img-btn.has-img{border-color:#555;color:var(--text);}
.bo-clear-btn:hover{border-color:var(--red);color:var(--red);background:#1a0a0a;}
.bo-clear-btn:active{transform:scale(.96);}
.info-box{background:var(--surface3);border-radius:5px;padding:7px 12px;font-size:10px;color:var(--text-dim);line-height:1.7;flex-shrink:0;}
.btn{padding:6px 12px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-family:inherit;font-size:11px;cursor:pointer;transition:all .13s;white-space:nowrap;}
.btn:hover{border-color:var(--amber-lo);color:var(--amber);}
.btn:active{transform:scale(.96);}
.btn.sm{padding:3px 8px;font-size:10px;}
.btn.ico{padding:3px 6px;font-size:10px;text-align:center;}
.btn.danger{border-color:#4a1a1a;color:var(--red);}
.btn.danger:hover{background:#3a1010;border-color:var(--red);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px;}
</style>
</head>
<body>

<!-- PROJECTOR -->
<div id="proj-root">
  <div id="proj-layer">
    <video id="proj-vid" playsinline muted></video>
    <img   id="proj-img" alt="">
  </div>
  <div id="proj-overlay"></div>
  <div id="proj-black"><img id="proj-black-img" alt=""></div>
  <div id="proj-start">
    <div class="ps-inner">
      <div class="ps-icon">▶</div>
      <div class="ps-text">クリックして全画面表示</div>
      <div class="ps-sub">クリックで表示許可 / 全画面</div>
    </div>
  </div>
</div>

<!-- CONTROL -->
<div id="ctrl-root">
  <div class="top-bar">
    <div class="top-left">
      <span class="bar-label" style="font-size:12px;letter-spacing:.1em">セグメント構成</span>
      <span class="live-badge" id="live-badge">● LIVE</span>
      <span style="flex:1"></span>
      <span class="bar-label">フェード</span>
      <input class="num-input" id="fade-secs" type="number" min="0" max="10" step="0.1" value="1.0" style="width:64px">
      <span class="bar-label">秒</span>
      <button class="btn sm" id="btn-add-seg">＋ 追加</button>
      <button class="btn sm" id="btn-save-cfg" title="設定をJSONファイルに書き出す">📤 設定保存</button>
      <button class="btn sm" id="btn-load-cfg" title="JSONファイルから設定を読み込む">📥 設定読込</button>
    </div>
    <div class="top-right">
      <span class="bar-title">⬡ Stage Video Player</span>
      <div id="dot" class="dot err"></div>
      <span id="proj-status" class="bar-label">Projector: 未接続</span>
      <button class="btn sm" id="btn-open-proj">プロジェクター画面を開く</button>
      <button class="btn sm" id="btn-sc-settings">⌨ SC設定</button>
      <button class="btn sm" id="btn-toggle-preview">プレビュー 非表示</button>
    </div>
  </div>

  <div class="main">
    <div class="seg-panel">
      <div class="seg-list" id="seg-list"></div>
    </div>
    <div class="right-panel">
      <div class="monitor-row">
        <div class="preview-box">
          <div id="preview-layer">
            <video id="preview-vid" playsinline></video>
            <img   id="preview-img" alt="">
          </div>
          <div class="preview-off" id="preview-off"><span>非表示中</span></div>
          <div id="preview-black"><img id="preview-black-img" alt=""></div>
        </div>
        <div class="timeline-wrap disabled" id="timeline-wrap">
          <input type="range" id="timeline" min="0" max="100" step="0.01" value="0">
          <span id="timeline-time">-:-- / -:--</span>
        </div>
        <div class="now-box">
          <span class="now-label">Now Playing</span>
          <span class="now-name" id="now-name">— 待機中 —</span>
          <span class="now-file"  id="now-file"></span>
        </div>
      </div>
      <div class="sub-area">
        <div class="prog-label">進行状況</div>
        <div class="prog-wrap" id="prog-wrap"></div>
        <div class="shortcuts">
          <span class="sc"><span class="key">Space</span> 再生/停止</span>
          <span class="sc"><span class="key">→</span> 次</span>
          <span class="sc"><span class="key">←</span> 前</span>
          <span class="sc"><span class="key">R</span> 最初から</span>
          <span class="sc"><span class="key">↓</span> 次SEG</span>
          <span class="sc"><span class="key">↑</span> 前SEG</span>
          <span class="sc"><span class="key">H</span> プレビュー</span>
          <span class="sc"><span class="key">B</span> BlackOUT</span>
        </div>
      </div>
      <div class="ctrl-area">
        <div class="ctrl-row1">
          <button class="cbtn" id="btn-prev-vid" title="前 (←)">⏮</button>
          <button class="cbtn" id="btn-restart"  title="最初から (R)">↩</button>
          <button class="cbtn play-btn" id="btn-pp" title="再生/一時停止 (Space)">▶</button>
          <button class="cbtn" id="btn-next-vid" title="次 (→)">⏭</button>
        </div>
        <div class="ctrl-row2">
          <button class="seg-btn" id="btn-prev-seg" disabled>
            <span>⏮⏮ SEG</span><span class="sbl">前のセグメント</span>
          </button>
          <button class="seg-btn" id="btn-next-seg" disabled>
            <span>SEG ⏭⏭</span><span class="sbl">次のセグメント</span>
          </button>
        </div>
        <div class="ctrl-row3">
          <button class="blackout-btn" id="btn-blackout">⬛ BLACK OUT</button>
          <div class="bo-side">
            <button class="bo-img-btn"   id="btn-bo-img"   title="BlackOUT画像を設定">🖼</button>
            <button class="bo-clear-btn" id="btn-bo-clear" title="BlackOUT画像をクリア" style="display:none">✕</button>
          </div>
        </div>
        <div class="info-box">
          各 ▶ で直接ジャンプ。動画・画像混在可。🎬フォルダ名と同名jpg/bmp/pngはタイトル表示。<br>
          BlackOUT画像: <span id="bo-img-name">未設定（黒）</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SC設定モーダル -->
<div id="sc-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px 28px;min-width:360px;max-width:460px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.6);">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <span style="font-size:14px;letter-spacing:.15em;color:var(--amber);">⌨ ショートカット設定</span>
      <button id="sc-close" style="background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:2px 8px;line-height:1;">✕</button>
    </div>
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:14px;">キー欄をクリック → 割り当てたいキーを押す</div>
    <table id="sc-table" style="width:100%;border-collapse:collapse;font-size:12px;"></table>
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end;">
      <button id="sc-reset" class="btn sm">デフォルトに戻す</button>
      <button id="sc-save"  class="btn sm" style="border-color:var(--amber);color:var(--amber);">保存</button>
    </div>
  </div>
</div>

<script>
// ─── INDEXEDDB ────────────────────────────────────────
const IDB = (() => {
  const DB = 'StageVP', VER = 1, ST = 'cfg';
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, VER);
      r.onupgradeneeded = e => e.target.result.createObjectStore(ST);
      r.onsuccess = e => res(e.target.result);
      r.onerror   = () => rej(r.error);
    });
  }
  async function set(k, v) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(ST, 'readwrite');
      tx.objectStore(ST).put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
  async function get(k) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(ST, 'readonly');
      const req = tx.objectStore(ST).get(k);
      req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
    });
  }
  return { set, get };
})();

// ─── MODE ─────────────────────────────────────────────
const IS_PROJ = new URLSearchParams(location.search).get('mode') === 'projector';
const CH = new BroadcastChannel('stage-vp-v4');
IS_PROJ ? initProjector() : initControl();

// ─── PROJECTOR ────────────────────────────────────────
function initProjector() {
  document.title = 'Projector Output';
  document.body.style.background = '#000';
  document.body.style.overflow   = 'hidden';

  const root     = document.getElementById('proj-root');
  const layer    = document.getElementById('proj-layer');
  const vid      = document.getElementById('proj-vid');
  const img      = document.getElementById('proj-img');
  const black    = document.getElementById('proj-black');
  const blackImg = document.getElementById('proj-black-img');
  const startOv  = document.getElementById('proj-start');
  root.classList.add('active');

  let projBlobUrl   = null;
  let blackBlobUrl  = null;
  let suppressEnded = false;
  let imageTimer    = null;
  let lastImgDur    = 0;
  let fadeSeq       = 0;
  let blackSeq      = 0;
  let audioReady    = false;
  let pendingPlay   = null;
  let blackoutStart = 0;

  startOv.addEventListener('click', () => {
    audioReady = true;
    startOv.style.display = 'none';
    root.requestFullscreen().catch(() => {});
    if (pendingPlay) { const d = pendingPlay; pendingPlay = null; processPLAY(d); }
  });
  root.addEventListener('click', () => {
    if (audioReady && !document.fullscreenElement) root.requestFullscreen().catch(() => {});
  });

  function fadeTo(el, opacity, secs) {
    return new Promise(resolve => {
      el.style.pointerEvents = opacity > 0 ? 'auto' : 'none';
      el.style.transition = secs > 0 ? `opacity ${secs}s ease` : 'none';
      void el.offsetHeight;
      el.style.opacity = String(opacity);
      secs > 0 ? setTimeout(resolve, secs * 1000 + 50) : resolve();
    });
  }

  function revoke(url) { if (url) URL.revokeObjectURL(url); }

  vid.addEventListener('ended', () => { if (!suppressEnded) CH.postMessage({ type:'VIDEO_ENDED' }); });
  vid.addEventListener('error', () => { if (!suppressEnded) CH.postMessage({ type:'VIDEO_ERROR'  }); });

  async function processPLAY(data) {
    suppressEnded = true;
    vid.pause();
    clearTimeout(imageTimer);

    const mySeq = ++fadeSeq;
    const fadeS = data.fadeSecs || 0;

    await fadeTo(layer, 0, fadeS);
    if (mySeq !== fadeSeq) { suppressEnded = false; return; }

    revoke(projBlobUrl); projBlobUrl = null;
    try { const f = await data.handle.getFile(); projBlobUrl = URL.createObjectURL(f); }
    catch(e) { console.error('proj getFile', e); suppressEnded = false; return; }
    if (mySeq !== fadeSeq) { suppressEnded = false; return; }

    if (data.itemType === 'image') {
      vid.style.display = 'none'; vid.src = '';
      img.src = projBlobUrl; img.style.display = 'block';
      lastImgDur = data.imageDuration || 0;
    } else {
      img.style.display = 'none'; img.src = '';
      vid.style.display = 'block';
      vid.src = projBlobUrl; vid.currentTime = 0;
      vid.play().catch(e => console.warn('proj play', e));
      lastImgDur = 0;
    }

    await fadeTo(layer, 1, fadeS);
    if (mySeq !== fadeSeq) { suppressEnded = false; return; }
    suppressEnded = false;

    if (data.itemType === 'video' && vid.ended) { CH.postMessage({ type:'VIDEO_ENDED' }); return; }
    if (data.itemType === 'image' && data.imageDuration > 0) {
      lastImgDur = data.imageDuration;
      imageTimer = setTimeout(() => { if (mySeq === fadeSeq) CH.postMessage({ type:'IMAGE_ENDED' }); }, data.imageDuration * 1000);
    }
  }

  CH.onmessage = async ({ data }) => {
    switch (data.type) {
      case 'PING': CH.postMessage({ type:'READY' }); break;
      case 'PLAY':
        if (!audioReady) { pendingPlay = data; return; }
        await processPLAY(data); break;
      case 'RESTART':
        clearTimeout(imageTimer);
        if (vid.style.display !== 'none' && vid.src) { vid.currentTime = 0; vid.play().catch(() => {}); }
        if (lastImgDur > 0) {
          const sq = fadeSeq;
          imageTimer = setTimeout(() => { if (sq === fadeSeq) CH.postMessage({ type:'IMAGE_ENDED' }); }, lastImgDur * 1000);
        }
        break;
      case 'PAUSE': {
        const mySeq = ++fadeSeq;
        clearTimeout(imageTimer); suppressEnded = true;
        await fadeTo(layer, 0, data.fadeSecs || 0);
        vid.pause(); break;
      }
      case 'RESUME': {
        ++fadeSeq; suppressEnded = false;
        if (vid.style.display !== 'none' && vid.src) {
          vid.play().catch(() => {});
          if (vid.ended) { CH.postMessage({ type:'VIDEO_ENDED' }); break; }
        }
        await fadeTo(layer, 1, data.fadeSecs || 0); break;
      }
      case 'SEEK':
        if (vid.style.display !== 'none' && vid.src && !isNaN(data.time)) vid.currentTime = data.time;
        break;
      case 'BLACKOUT': {
        const mySeq = ++blackSeq;
        revoke(blackBlobUrl); blackBlobUrl = null;
        blackImg.style.display = 'none'; blackImg.src = '';
        if (data.handle) {
          try { const f = await data.handle.getFile(); blackBlobUrl = URL.createObjectURL(f); blackImg.src = blackBlobUrl; blackImg.style.display = 'block'; }
          catch(e) { console.warn('blackout img', e); }
        }
        if (mySeq === blackSeq) await fadeTo(black, 1, data.fadeSecs || 0);
        clearTimeout(imageTimer); vid.pause(); blackoutStart = Date.now(); break;
      }
      case 'UNBLACKOUT': {
        const mySeq = ++blackSeq;
        if (vid.style.display !== 'none' && vid.src) {
          vid.play().catch(() => {});
          if (vid.ended) { CH.postMessage({ type:'VIDEO_ENDED' }); break; }
        }
        if (lastImgDur > 0 && blackoutStart > 0) {
          const elapsed = (Date.now() - blackoutStart) / 1000;
          const remaining = Math.max(0, lastImgDur - elapsed);
          if (remaining > 0) { imageTimer = setTimeout(() => { if (mySeq === blackSeq) CH.postMessage({ type:'IMAGE_ENDED' }); }, remaining * 1000); }
          else { CH.postMessage({ type:'IMAGE_ENDED' }); }
        }
        blackoutStart = 0;
        if (mySeq === blackSeq) {
          await fadeTo(black, 0, data.fadeSecs || 0);
          blackImg.style.display = 'none'; blackImg.src = ''; revoke(blackBlobUrl); blackBlobUrl = null;
        }
        break;
      }
      case 'STOP':
        suppressEnded = true; clearTimeout(imageTimer);
        vid.pause(); vid.src = ''; img.src = '';
        img.style.display = 'none'; vid.style.display = 'none';
        revoke(projBlobUrl); projBlobUrl = null;
        layer.style.transition = 'none'; void layer.offsetHeight; layer.style.opacity = '1';
        suppressEnded = false; break;
    }
  };
  CH.postMessage({ type:'READY' });
}

// ─── CONTROL ──────────────────────────────────────────
function initControl() {
  document.getElementById('ctrl-root').classList.add('active');

  const VIDEO_EXTS = new Set(['mp4','webm','mov','avi','mkv','m4v','ogv','ogg','ts']);
  const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','bmp','avif','svg']);
  const TITLE_EXTS = new Set(['jpg','jpeg','bmp','png']);

  const DEFAULTS = [
    { name:'タイトル',       mode:'sequential', imgDur:0 },
    { name:'演奏１',         mode:'random',     imgDur:5 },
    { name:'MC',             mode:'sequential', imgDur:0 },
    { name:'演奏２',         mode:'random',     imgDur:5 },
    { name:'演奏３',         mode:'random',     imgDur:5 },
    { name:'MC',             mode:'sequential', imgDur:0 },
    { name:'演奏４',         mode:'random',     imgDur:5 },
    { name:'演奏５',         mode:'random',     imgDur:5 },
    { name:'エンドタイトル', mode:'sequential', imgDur:0 },
  ];

  let nextId = 1;
  function makeSeg(name, mode, imgDur) {
    return { id:nextId++, name, mode, imgDur:imgDur??5,
             dirHandle:null, files:[], order:[], orderPos:0,
             titleFile:null, titleShowing:false };
  }

  const S = {
    segments:       DEFAULTS.map(d => makeSeg(d.name, d.mode, d.imgDur)),
    curSegIdx:      -1,
    curItemType:    'video',
    isPlaying:      false,
    previewOn:      true,
    projReady:      false,
    projWin:        null,
    blackout:       false,
    blackoutHandle: null,
  };

  let previewBlobUrl   = null;
  let prevBlackBlobUrl = null;
  let vidStartTs       = null;
  let imgTimerFallback = null;
  let playSeq          = 0;
  let isSeeking        = false;
  let lastDirHandle    = null;

  const $dot         = document.getElementById('dot');
  const $projStatus  = document.getElementById('proj-status');
  const $nowName     = document.getElementById('now-name');
  const $nowFile     = document.getElementById('now-file');
  const $progWrap    = document.getElementById('prog-wrap');
  const $prevLayer   = document.getElementById('preview-layer');
  const $prevVid     = document.getElementById('preview-vid');
  const $prevImg     = document.getElementById('preview-img');
  const $prevOff     = document.getElementById('preview-off');
  const $prevBlack   = document.getElementById('preview-black');
  const $prevBlackImg= document.getElementById('preview-black-img');
  const $ppBtn       = document.getElementById('btn-pp');
  const $prevToggle  = document.getElementById('btn-toggle-preview');
  const $fadeSecs    = document.getElementById('fade-secs');
  const $liveBadge   = document.getElementById('live-badge');
  const $nextSeg     = document.getElementById('btn-next-seg');
  const $prevSeg     = document.getElementById('btn-prev-seg');
  const $boBtn       = document.getElementById('btn-blackout');
  const $boImgBtn    = document.getElementById('btn-bo-img');
  const $boClearBtn  = document.getElementById('btn-bo-clear');
  const $boImgName   = document.getElementById('bo-img-name');
  const $timeline    = document.getElementById('timeline');
  const $timelineTime= document.getElementById('timeline-time');
  const $timelineWrap= document.getElementById('timeline-wrap');

  function getFade() { return Math.max(0, parseFloat($fadeSecs.value) || 0); }
  function fmt(s) {
    if (!s || isNaN(s)) return '-:--';
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }

  // ── IndexedDB ──
  async function saveCfg() {
    try {
      await IDB.set('fadeSecs', getFade());
      await IDB.set('segments', S.segments.map(s => ({ name:s.name, mode:s.mode, imgDur:s.imgDur })));
    } catch(e) { console.warn('saveCfg', e); }
  }

  async function loadCfg() {
    try {
      const fade = await IDB.get('fadeSecs');
      if (fade != null) $fadeSecs.value = fade;
      const segs = await IDB.get('segments');
      if (segs && segs.length > 0) {
        S.segments = segs.map(s => makeSeg(s.name, s.mode, s.imgDur));
      }
      renderList(); renderProgress();
    } catch(e) { console.warn('loadCfg', e); }
  }

  // ── 設定 JSON エクスポート ──
  document.getElementById('btn-save-cfg').addEventListener('click', async () => {
    const data = {
      fadeSecs: getFade(),
      segments: S.segments.map(s => ({ name:s.name, mode:s.mode, imgDur:s.imgDur })),
      shortcuts: { ...SC },
    };
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: 'stage-video-player-settings.json',
        types: [{ description:'JSON設定ファイル', accept:{'application/json':['.json']} }],
        startIn: lastDirHandle || undefined,
      });
      const wr = await fh.createWritable();
      await wr.write(JSON.stringify(data, null, 2));
      await wr.close();
    } catch(e) { if (e.name !== 'AbortError') alert('保存エラー:\n' + e.message); }
  });

  // ── 設定 JSON インポート ──
  document.getElementById('btn-load-cfg').addEventListener('click', async () => {
    try {
      const [fh] = await window.showOpenFilePicker({
        types: [{ description:'JSON設定ファイル', accept:{'application/json':['.json']} }],
        startIn: lastDirHandle || undefined,
      });
      const file = await fh.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.fadeSecs != null) $fadeSecs.value = data.fadeSecs;
      if (data.segments && data.segments.length > 0) {
        S.segments = data.segments.map(s => makeSeg(s.name, s.mode, s.imgDur??5));
      }
      if (data.shortcuts) {
        SC = { ...SC_DEFAULTS, ...data.shortcuts };
        await saveSC();
        updateShortcutDisplay();
      }
      await saveCfg();
      renderList(); renderProgress();
    } catch(e) { if (e.name !== 'AbortError') alert('読込エラー:\n' + e.message); }
  });

  $fadeSecs.addEventListener('change', saveCfg);

  // ── タイムライン ──
  $prevVid.addEventListener('timeupdate', () => {
    if (isSeeking || !$prevVid.duration || isNaN($prevVid.duration)) return;
    $timeline.value = ($prevVid.currentTime / $prevVid.duration) * 100;
    $timelineTime.textContent = `${fmt($prevVid.currentTime)} / ${fmt($prevVid.duration)}`;
  });
  $prevVid.addEventListener('durationchange', () => {
    if ($prevVid.duration && !isNaN($prevVid.duration))
      $timelineTime.textContent = `${fmt($prevVid.currentTime)} / ${fmt($prevVid.duration)}`;
  });
  $timeline.addEventListener('mousedown',  () => { isSeeking = true; });
  $timeline.addEventListener('touchstart', () => { isSeeking = true; }, { passive:true });
  $timeline.addEventListener('input', () => {
    if ($prevVid.duration && !isNaN($prevVid.duration)) {
      const t = ($timeline.value / 100) * $prevVid.duration;
      $prevVid.currentTime = t;
      $timelineTime.textContent = `${fmt(t)} / ${fmt($prevVid.duration)}`;
      CH.postMessage({ type:'SEEK', time:t });
    }
  });
  $timeline.addEventListener('change', () => { isSeeking = false; });
  $timeline.addEventListener('mouseup',  () => { isSeeking = false; });
  $timeline.addEventListener('touchend', () => { isSeeking = false; });

  function setTimelineMode(isVideo) {
    $timelineWrap.classList.toggle('disabled', !isVideo);
    if (!isVideo) { $timeline.value = 0; $timelineTime.textContent = '-:-- / -:--'; }
  }

  // ── フェードヘルパー ──
  function fadePreviewLayerTo(opacity, secs) {
    return new Promise(resolve => {
      $prevLayer.style.transition = secs > 0 ? `opacity ${secs}s ease` : 'none';
      void $prevLayer.offsetHeight;
      $prevLayer.style.opacity = String(opacity);
      secs > 0 ? setTimeout(resolve, secs * 1000 + 30) : resolve();
    });
  }
  function fadePreviewBlackTo(opacity, secs) {
    return new Promise(resolve => {
      $prevBlack.style.pointerEvents = opacity > 0 ? 'auto' : 'none';
      $prevBlack.style.transition = secs > 0 ? `opacity ${secs}s ease` : 'none';
      void $prevBlack.offsetHeight;
      $prevBlack.style.opacity = String(opacity);
      secs > 0 ? setTimeout(resolve, secs * 1000 + 30) : resolve();
    });
  }

  // ── Channel ──
  CH.onmessage = ({ data }) => {
    if (data.type === 'READY')       setReady(true);
    if (data.type === 'VIDEO_ENDED') onEnded();
    if (data.type === 'IMAGE_ENDED') onEnded();
    if (data.type === 'VIDEO_ERROR') onEnded();
  };
  $prevVid.addEventListener('ended', () => { if (!S.projReady) onEnded(); });

  function setReady(v) {
    S.projReady = v;
    $dot.className = 'dot ' + (v ? 'ok' : 'err');
    $projStatus.textContent = 'Projector: ' + (v ? '接続済み' : '未接続');
    const $pb = document.getElementById('btn-open-proj');
    if (v) {
      $pb.style.borderColor = 'var(--green)';
      $pb.style.color       = 'var(--green)';
      $pb.style.background  = 'rgba(62,207,110,0.12)';
    } else {
      $pb.style.borderColor = '';
      $pb.style.color       = '';
      $pb.style.background  = '';
    }
  }
  function setLive(v) {
    $liveBadge.classList.toggle('show', v);
    $nextSeg.disabled = !v; $prevSeg.disabled = !v;
  }

  // ★ 再生状態に合わせてSEG次ボタンの点滅を制御
  function syncPlayState(playing) {
    S.isPlaying = playing;
    $ppBtn.textContent = playing ? '⏸' : '▶';
    if (playing) $nextSeg.classList.add('is-playing');
    else         $nextSeg.classList.remove('is-playing');
  }

  document.getElementById('btn-open-proj').addEventListener('click', () => {
    if (S.projWin && !S.projWin.closed) { S.projWin.focus(); return; }
    S.projWin = window.open(
      location.href.split('?')[0] + '?mode=projector',
      'stage-projector',
      'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no'
    );
    setTimeout(() => CH.postMessage({ type:'PING' }),  900);
    setTimeout(() => CH.postMessage({ type:'PING' }), 2200);
    const watchId = setInterval(() => {
      if (S.projWin && S.projWin.closed) {
        setReady(false); S.projWin = null; clearInterval(watchId);
      }
    }, 1000);
  });

  $prevToggle.addEventListener('click', togglePreview);
  function togglePreview() {
    S.previewOn = !S.previewOn;
    if (S.previewOn) {
      $prevLayer.style.transition = 'none'; $prevLayer.style.opacity = '1';
      $prevLayer.style.display = ''; $prevOff.style.display = 'none';
      $prevToggle.textContent = 'プレビュー 非表示';
      showPreviewCurrent(); setTimelineMode(S.curItemType === 'video');
    } else {
      $prevVid.pause(); $prevVid.src = ''; $prevVid.style.display = 'none';
      $prevImg.src = ''; $prevImg.style.display = 'none';
      $prevLayer.style.display = 'none'; $prevOff.style.display = 'flex';
      $prevToggle.textContent = 'プレビュー 表示'; setTimelineMode(false);
    }
  }
  function showPreviewCurrent() {
    $prevLayer.style.transition = 'none'; $prevLayer.style.opacity = '1';
    if (S.curSegIdx < 0 || !previewBlobUrl) return;
    const seg = S.segments[S.curSegIdx]; if (!seg) return;
    const isImg = seg.titleShowing || (seg.files.length && seg.files[seg.order[seg.orderPos]].type === 'image');
    if (isImg) {
      $prevVid.pause(); $prevVid.style.display='none'; $prevVid.src='';
      $prevImg.style.display='block'; $prevImg.src=previewBlobUrl;
    } else if (seg.files.length) {
      $prevImg.style.display='none'; $prevImg.src='';
      $prevVid.style.display='block';
      $prevVid.src = previewBlobUrl;
      $prevVid.addEventListener('loadedmetadata', () => {
        const elapsed = vidStartTs ? (Date.now() - vidStartTs) / 1000 : 0;
        $prevVid.currentTime = Math.max(0, Math.min(elapsed, $prevVid.duration || 0));
        if (S.isPlaying) $prevVid.play().catch(() => {});
      }, { once: true });
    }
  }

  // ── BlackOUT ──
  $boBtn.addEventListener('click', toggleBlackout);
  $boImgBtn.addEventListener('click', async () => {
    try {
      const [handle] = await window.showOpenFilePicker({
        types:[{ description:'画像', accept:{'image/*':['.jpg','.jpeg','.png','.bmp','.gif','.webp','.avif']} }],
        multiple:false, startIn: lastDirHandle || undefined,
      });
      S.blackoutHandle = handle;
      $boImgName.textContent = handle.name;
      $boImgBtn.classList.add('has-img');
      $boClearBtn.style.display = 'flex';
    } catch(e) { if (e.name !== 'AbortError') alert('画像選択エラー:\n' + e.message); }
  });
  $boClearBtn.addEventListener('click', () => {
    S.blackoutHandle = null;
    $boImgName.textContent = '未設定（黒）';
    $boImgBtn.classList.remove('has-img');
    $boClearBtn.style.display = 'none';
  });
  async function toggleBlackout() {
    S.blackout = !S.blackout;
    const fs = getFade();
    if (S.blackout) {
      CH.postMessage({ type:'BLACKOUT', handle:S.blackoutHandle||null, fadeSecs:fs });
      $prevBlackImg.style.display = 'none'; $prevBlackImg.src = '';
      if (S.blackoutHandle) {
        try {
          const f = await S.blackoutHandle.getFile();
          if (prevBlackBlobUrl) URL.revokeObjectURL(prevBlackBlobUrl);
          prevBlackBlobUrl = URL.createObjectURL(f);
          $prevBlackImg.src = prevBlackBlobUrl; $prevBlackImg.style.display = 'block';
        } catch(e) { console.warn('preview blackout img', e); }
      }
      fadePreviewBlackTo(1, fs).then(() => { $prevVid.pause(); });
      $boBtn.textContent = '◀ 復帰（BlackOUT中）'; $boBtn.classList.add('active');
    } else {
      CH.postMessage({ type:'UNBLACKOUT', fadeSecs:fs });
      if (S.previewOn && S.curItemType === 'video' && S.isPlaying) $prevVid.play().catch(() => {});
      await fadePreviewBlackTo(0, fs);
      $prevBlackImg.style.display = 'none'; $prevBlackImg.src = '';
      if (prevBlackBlobUrl) { URL.revokeObjectURL(prevBlackBlobUrl); prevBlackBlobUrl = null; }
      $boBtn.textContent = '⬛ BLACK OUT'; $boBtn.classList.remove('active');
    }
  }

  // ── Segment list ──
  function renderList() {
    const list = document.getElementById('seg-list');
    list.innerHTML = '';
    S.segments.forEach((seg, idx) => {
      const div = document.createElement('div');
      div.className = 'seg-item'
        + (idx === S.curSegIdx ? ' is-current' : '')
        + (idx  <  S.curSegIdx ? ' is-done'    : '');
      const fl = seg.dirHandle ? '📁 ' + esc(seg.dirHandle.name) : '📂 選択…';
      let cl = seg.files.length ? seg.files.length + '本' : (seg.dirHandle ? '…' : '');
      if (seg.titleFile) cl += (cl ? ' ' : '') + '＋T';
      const cc = (seg.files.length || seg.titleFile) ? 'ok' : '';
      const tbHtml = seg.titleFile
        ? `<span class="title-badge" title="タイトル画像: ${esc(seg.titleFile.name)}">🎬 T</span>` : '';
      div.innerHTML = `
        <div class="seg-content">
          <div class="seg-row1">
            <span class="seg-num">${idx+1}</span>
            <input class="seg-name-input" data-id="${seg.id}" type="text"
              value="${esc(seg.name)}" placeholder="セグメント名">
            ${tbHtml}
            <div class="ord-btns">
              <button class="btn sm ico mv-up" data-id="${seg.id}" style="padding:1px 4px" title="上へ">▲</button>
              <button class="btn sm ico mv-dn" data-id="${seg.id}" style="padding:1px 4px" title="下へ">▼</button>
            </div>
            <button class="btn sm ico danger rm-seg" data-id="${seg.id}" title="削除">✕</button>
          </div>
          <div class="seg-row2">
            <select class="mode-sel" data-id="${seg.id}">
              <option value="sequential" ${seg.mode==='sequential'?'selected':''}>順次</option>
              <option value="random"     ${seg.mode==='random'    ?'selected':''}>ランダム</option>
            </select>
            <button class="btn sm folder-btn" data-id="${seg.id}">${fl}</button>
            <span class="file-count ${cc}">${cl}</span>
            <div class="img-dur-wrap">
              <span class="img-dur-lbl">🖼</span>
              <input class="num-input img-num img-dur-input" data-id="${seg.id}"
                type="number" min="0" max="3600" step="1" value="${seg.imgDur}">
              <span class="img-dur-lbl">秒</span>
            </div>
          </div>
        </div>
        <button class="seg-play-btn" data-idx="${idx}" title="このセグメントを再生">
          <span class="pi">▶</span><span class="pl">PLAY</span>
        </button>`;
      list.appendChild(div);
    });

    list.querySelectorAll('.seg-name-input').forEach(el =>
      el.addEventListener('change', e => { const s=byId(e.target.dataset.id); if(s){s.name=e.target.value; saveCfg();} })
    );
    list.querySelectorAll('.mode-sel').forEach(el =>
      el.addEventListener('change', e => { const s=byId(e.target.dataset.id); if(s){s.mode=e.target.value; saveCfg();} })
    );
    list.querySelectorAll('.img-dur-input').forEach(el =>
      el.addEventListener('change', e => {
        const s=byId(e.target.dataset.id);
        if(s){s.imgDur=Math.max(0,parseInt(e.target.value)||0); saveCfg();}
      })
    );
    list.querySelectorAll('.folder-btn').forEach(el =>
      el.addEventListener('click', e => selectFolder(e.target.dataset.id))
    );
    list.querySelectorAll('.rm-seg').forEach(el =>
      el.addEventListener('click', e => {
        S.segments = S.segments.filter(s => s.id != e.target.dataset.id);
        renderList(); renderProgress(); saveCfg();
      })
    );
    list.querySelectorAll('.mv-up').forEach(el =>
      el.addEventListener('click', e => {
        const i=S.segments.findIndex(s=>s.id==e.target.dataset.id);
        if(i>0){swap(i,i-1);renderList();renderProgress();saveCfg();}
      })
    );
    list.querySelectorAll('.mv-dn').forEach(el =>
      el.addEventListener('click', e => {
        const i=S.segments.findIndex(s=>s.id==e.target.dataset.id);
        if(i<S.segments.length-1){swap(i,i+1);renderList();renderProgress();saveCfg();}
      })
    );
    list.querySelectorAll('.seg-play-btn').forEach(el =>
      el.addEventListener('click', e => goToSeg(parseInt(e.currentTarget.dataset.idx)))
    );
  }

  async function selectFolder(rawId) {
    try {
      const opts = { mode:'read' };
      if (lastDirHandle) { try { opts.startIn = lastDirHandle; } catch(e) {} }
      const dh = await window.showDirectoryPicker(opts);

      lastDirHandle = dh;

      const seg = byId(rawId); if (!seg) return;
      seg.dirHandle=dh; seg.files=[]; seg.titleFile=null; seg.titleShowing=false;
      renderList();

      const entries = [];
      for await (const entry of dh.values()) {
        if (entry.kind !== 'file') continue;
        const ext = entry.name.split('.').pop().toLowerCase();
        const type = VIDEO_EXTS.has(ext) ? 'video' : IMAGE_EXTS.has(ext) ? 'image' : null;
        if (type) entries.push({ handle:entry, type, name:entry.name });
      }
      entries.sort((a,b) => a.name.localeCompare(b.name));

      const bare = n => n.replace(/\.[^.]+$/, '');
      const folderName = dh.name.toLowerCase();
      const ti = entries.findIndex(e =>
        e.type === 'image' &&
        TITLE_EXTS.has(e.name.split('.').pop().toLowerCase()) &&
        bare(e.name).toLowerCase() === folderName
      );
      seg.titleFile = ti >= 0 ? entries.splice(ti, 1)[0] : null;
      seg.files = entries;
      renderList(); saveCfg();
    } catch(e) {
      if (e.name !== 'AbortError') alert('フォルダ選択エラー:\n' + e.message);
    }
  }

  document.getElementById('btn-add-seg').addEventListener('click', () => {
    S.segments.push(makeSeg('新しいセグメント','sequential',5));
    renderList(); renderProgress(); saveCfg();
    document.getElementById('seg-list').scrollTop = 99999;
  });

  function goToSeg(idx) {
    const seg = S.segments[idx];
    if (!seg || (!seg.files.length && !seg.titleFile)) { alert('フォルダが設定されていません。'); return; }
    if (S.curSegIdx < 0) {
      if (!S.projReady && !confirm('プロジェクター未接続。スタートしますか？')) return;
      S.segments.forEach(s => initOrder(s)); setLive(true);
    }
    S.curSegIdx = idx;
    renderList(); renderProgress();
    playSeg(true);
  }

  function initOrder(seg) {
    if (!seg.files.length) return;
    const arr = [...Array(seg.files.length).keys()];
    seg.order = seg.mode === 'random' ? shuffle(arr) : arr; seg.orderPos = 0;
  }

  async function playSeg(isNew) {
    const seg = S.segments[S.curSegIdx]; if (!seg) return;
    if (isNew) {
      initOrder(seg); seg.titleShowing = false;
      if (seg.titleFile) {
        seg.titleShowing = true;
        await playRawItem(seg.titleFile, 0, seg.name);
        renderList(); renderProgress(); updateNowPlaying(); return;
      }
    }
    if (!seg.files.length) return;
    await playItem(isNew && !seg.titleFile ? seg.name : null);
    renderList(); renderProgress(); updateNowPlaying();
  }

  async function playRawItem(item, imgDur, segNameOverlay) {
    const mySeq = ++playSeq;
    clearTimeout(imgTimerFallback);
    S.curItemType = item.type;
    const fadeS = getFade();

    CH.postMessage({
      type:'PLAY', handle:item.handle, itemType:item.type,
      imageDuration:imgDur, fadeSecs:fadeS, segName:segNameOverlay||null,
    });
    if (S.projWin && !S.projWin.closed) S.projWin.focus();

    const fadeOutPromise = (S.previewOn && fadeS > 0)
      ? fadePreviewLayerTo(0, fadeS) : Promise.resolve();

    let file;
    try { file = await item.handle.getFile(); }
    catch(e) { console.error('getFile', e); return; }
    if (mySeq !== playSeq) return;

    let pUrl;
    try { pUrl = URL.createObjectURL(file); }
    catch(e) { return; }
    if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);
    previewBlobUrl = pUrl;

    await fadeOutPromise;
    if (mySeq !== playSeq) { URL.revokeObjectURL(pUrl); previewBlobUrl = null; return; }

    if (S.previewOn) {
      if (item.type === 'video') {
        $prevImg.style.display='none'; $prevImg.src='';
        $prevVid.style.display='block'; $prevVid.src=pUrl;
        $prevVid.currentTime=0; $prevVid.play().catch(() => {});
      } else {
        $prevVid.pause(); $prevVid.style.display='none'; $prevVid.src='';
        $prevImg.style.display='block'; $prevImg.src=pUrl;
      }
      if (fadeS > 0) await fadePreviewLayerTo(1, fadeS);
      else { $prevLayer.style.transition='none'; void $prevLayer.offsetHeight; $prevLayer.style.opacity='1'; }
    }

    setTimelineMode(item.type === 'video');
    if (!S.projReady && item.type==='image' && imgDur>0)
      imgTimerFallback = setTimeout(onEnded, imgDur * 1000);
    vidStartTs = Date.now();
    syncPlayState(true);
  }

  async function playItem(segNameOverlay) {
    const seg = S.segments[S.curSegIdx]; if (!seg || !seg.files.length) return;
    const item = seg.files[seg.order[seg.orderPos]];
    await playRawItem(item, item.type==='image' ? seg.imgDur : 0, segNameOverlay);
  }

  function onEnded() {
    clearTimeout(imgTimerFallback);
    const seg = S.segments[S.curSegIdx]; if (!seg) return;
    if (seg.titleShowing) return;
    if (!seg.files.length) return;
    seg.orderPos++;
    if (seg.orderPos >= seg.order.length) {
      seg.orderPos = 0;
      if (seg.mode==='random') seg.order = shuffle([...Array(seg.files.length).keys()]);
    }
    playItem(null); updateNowPlaying();
  }

  function restartItem() {
    if (S.curSegIdx < 0) return;
    CH.postMessage({ type:'RESTART' });
    if (S.previewOn && S.curItemType==='video') {
      $prevVid.currentTime=0; if (S.isPlaying) $prevVid.play().catch(() => {});
    }
    clearTimeout(imgTimerFallback);
    const seg = S.segments[S.curSegIdx];
    if (seg && !S.projReady && S.curItemType==='image') {
      const dur = seg.titleShowing ? 0 : seg.imgDur;
      if (dur > 0) imgTimerFallback = setTimeout(onEnded, dur * 1000);
    }
    vidStartTs = Date.now();
  }

  function nextItem() {
    const seg = S.segments[S.curSegIdx]; if (!seg) return;
    if (seg.titleShowing) {
      seg.titleShowing = false;
      if (seg.files.length) {
        playItem(null); renderList(); renderProgress(); updateNowPlaying(); return;
      }
      nextSeg(); return;
    }
    if (!seg.files.length) return;
    seg.orderPos = (seg.orderPos+1) % seg.order.length;
    if (seg.orderPos===0 && seg.mode==='random') seg.order = shuffle([...Array(seg.files.length).keys()]);
    playItem(null);
  }

  function prevItem() {
    const seg = S.segments[S.curSegIdx];
    if (!seg || seg.titleShowing || !seg.files.length) return;
    seg.orderPos = (seg.orderPos-1+seg.order.length) % seg.order.length;
    playItem(null);
  }

  function nextSeg() {
    if (S.curSegIdx < 0) return;
    const cur = S.segments[S.curSegIdx];
    if (cur && cur.titleShowing) {
      cur.titleShowing = false;
      if (cur.files.length) {
        playItem(null); renderList(); renderProgress(); updateNowPlaying();
        return;
      }
    }
    let ni = S.curSegIdx+1;
    while (ni < S.segments.length && !S.segments[ni].files.length && !S.segments[ni].titleFile) ni++;
    if (ni >= S.segments.length) return;
    S.curSegIdx = ni;
    renderList(); renderProgress();
    playSeg(true);
  }

  function prevSeg() {
    if (S.curSegIdx <= 0) return;
    let pi = S.curSegIdx-1;
    while (pi >= 0 && !S.segments[pi].files.length && !S.segments[pi].titleFile) pi--;
    if (pi < 0) return;
    S.curSegIdx = pi;
    renderList(); renderProgress();
    playSeg(true);
  }

  async function togglePlay() {
    if (S.curSegIdx < 0) return;
    S.isPlaying = !S.isPlaying;
    const fs = getFade();
    if (S.isPlaying) {
      CH.postMessage({ type:'RESUME', fadeSecs:fs });
      if (S.previewOn) {
        if (S.curItemType === 'video') $prevVid.play().catch(() => {});
        if (fs > 0) await fadePreviewLayerTo(1, fs);
        else { $prevLayer.style.transition='none'; void $prevLayer.offsetHeight; $prevLayer.style.opacity='1'; }
      }
      syncPlayState(true);
    } else {
      CH.postMessage({ type:'PAUSE', fadeSecs:fs });
      if (S.previewOn && fs > 0) await fadePreviewLayerTo(0, fs);
      $prevVid.pause();
      syncPlayState(false);
    }
  }

  function updateNowPlaying() {
    if (S.curSegIdx < 0) { $nowName.innerHTML='— 待機中 —'; $nowFile.textContent=''; return; }
    const seg = S.segments[S.curSegIdx];
    if (seg.titleShowing && seg.titleFile) {
      $nowName.innerHTML = `[${S.curSegIdx+1}] ${esc(seg.name)}<span class="now-badge ttl">TITLE</span>`;
      $nowFile.textContent = `${seg.titleFile.name}  ∞ 手動`; return;
    }
    const item = seg.files.length ? seg.files[seg.order[seg.orderPos]] : null;
    const badge = item
      ? (item.type==='video' ? '<span class="now-badge vid">VIDEO</span>' : '<span class="now-badge img">IMAGE</span>') : '';
    $nowName.innerHTML = `[${S.curSegIdx+1}] ${esc(seg.name)}${badge}`;
    if (item) {
      const extra = item.type==='image' && seg.imgDur===0 ? '  ∞ 手動' : '';
      $nowFile.textContent = `${item.name}  (${seg.orderPos+1} / ${seg.files.length})${extra}`;
    }
  }

  function renderProgress() {
    $progWrap.innerHTML = '';
    S.segments.forEach((_,i) => {
      const d = document.createElement('div');
      d.className = 'prog-dot' + (i===S.curSegIdx?' current':'') + (i<S.curSegIdx?' done':'');
      d.title = S.segments[i].name; $progWrap.appendChild(d);
    });
  }

  document.getElementById('btn-prev-vid').addEventListener('click', prevItem);
  document.getElementById('btn-next-vid').addEventListener('click', nextItem);
  document.getElementById('btn-pp'      ).addEventListener('click', togglePlay);
  document.getElementById('btn-restart' ).addEventListener('click', restartItem);
  $nextSeg.addEventListener('click', nextSeg);
  $prevSeg.addEventListener('click', prevSeg);

  // ── ショートカット設定 ──
  const SC_DEFAULTS = {
    play:    'Space',
    next:    'ArrowRight',
    prev:    'ArrowLeft',
    restart: 'r',
    nextSeg: 'ArrowDown',
    prevSeg: 'ArrowUp',
    preview: 'h',
    blackout:'b',
  };
  const SC_LABELS = {
    play:    '再生 / 停止',
    next:    '次の動画・画像',
    prev:    '前の動画・画像',
    restart: '最初から',
    nextSeg: '次のセグメント',
    prevSeg: '前のセグメント',
    preview: 'プレビュー切替',
    blackout:'BlackOUT',
  };

  // 表示用キー名
  function keyLabel(k) {
    const m = { ' ':'Space','ArrowRight':'→','ArrowLeft':'←','ArrowUp':'↑','ArrowDown':'↓','Backspace':'BS','Escape':'Esc','Enter':'Enter','Delete':'Del' };
    return m[k] || k.toUpperCase();
  }

  let SC = { ...SC_DEFAULTS };

  // IDBから読み込み
  async function loadSC() {
    try {
      const saved = await IDB.get('shortcuts');
      if (saved) SC = { ...SC_DEFAULTS, ...saved };
    } catch(e) {}
    updateShortcutDisplay();
  }
  async function saveSC() {
    try { await IDB.set('shortcuts', SC); } catch(e) {}
  }

  // ショートカット表示欄を更新
  function updateShortcutDisplay() {
    const list = document.querySelector('.shortcuts');
    if (!list) return;
    list.innerHTML = Object.entries(SC_LABELS).map(([id, lbl]) =>
      `<span class="sc"><span class="key">${keyLabel(SC[id])}</span> ${lbl}</span>`
    ).join('');
  }

  // SC設定モーダル
  const $scModal   = document.getElementById('sc-modal');
  const $scTable   = document.getElementById('sc-table');
  const $scClose   = document.getElementById('sc-close');
  const $scReset   = document.getElementById('sc-reset');
  const $scSave    = document.getElementById('sc-save');
  let editSC       = {};   // モーダル内の編集中の値
  let listeningId  = null; // 現在キー待ちのアクションID

  function openSCModal() {
    editSC = { ...SC };
    listeningId = null;
    renderSCTable();
    $scModal.style.display = 'flex';
  }
  function closeSCModal() {
    listeningId = null;
    $scModal.style.display = 'none';
  }

  function renderSCTable() {
    $scTable.innerHTML = '';
    Object.entries(SC_LABELS).forEach(([id, lbl]) => {
      const tr = document.createElement('tr');
      const isListening = listeningId === id;
      tr.innerHTML = `
        <td style="padding:7px 0;color:var(--text-dim);width:55%;">${lbl}</td>
        <td style="padding:7px 0;text-align:right;">
          <button class="sc-key-btn" data-id="${id}"
            style="font-family:inherit;font-size:12px;padding:4px 12px;
              border-radius:4px;cursor:pointer;min-width:70px;
              border:1px solid ${isListening ? 'var(--amber)' : 'var(--border)'};
              background:${isListening ? 'rgba(245,166,35,.15)' : 'var(--surface3)'};
              color:${isListening ? 'var(--amber)' : 'var(--text)'};">
            ${isListening ? '… 押してください' : keyLabel(editSC[id])}
          </button>
        </td>`;
      $scTable.appendChild(tr);
    });
    $scTable.querySelectorAll('.sc-key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        listeningId = btn.dataset.id;
        renderSCTable();
      });
    });
  }

  // モーダル内のキー入力をキャプチャ（documentレベルで監視）
  document.addEventListener('keydown', e => {
    if ($scModal.style.display === 'none') return;
    if (!listeningId) return;
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { listeningId = null; renderSCTable(); return; }
    editSC[listeningId] = e.key;
    listeningId = null;
    renderSCTable();
  }, true); // capture phase で先に取得

  $scClose.addEventListener('click', closeSCModal);
  $scModal.addEventListener('click', e => { if (e.target === $scModal) closeSCModal(); });

  $scReset.addEventListener('click', () => {
    editSC = { ...SC_DEFAULTS };
    listeningId = null;
    renderSCTable();
  });

  $scSave.addEventListener('click', async () => {
    SC = { ...editSC };
    await saveSC();
    updateShortcutDisplay();
    closeSCModal();
  });

  document.getElementById('btn-sc-settings').addEventListener('click', openSCModal);

  // キーボードハンドラ（SC変数を参照）
  document.addEventListener('keydown', e => {
    if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    if ($scModal.style.display !== 'none') return; // モーダル中は無視
    const k = e.key;
    if      (k === SC.play)    { e.preventDefault(); togglePlay(); }
    else if (k === SC.next)    { e.preventDefault(); if(S.curSegIdx>=0) nextItem(); }
    else if (k === SC.prev)    { e.preventDefault(); if(S.curSegIdx>=0) prevItem(); }
    else if (k === SC.restart) { if(S.curSegIdx>=0) restartItem(); }
    else if (k === SC.nextSeg) { e.preventDefault(); nextSeg(); }
    else if (k === SC.prevSeg) { e.preventDefault(); prevSeg(); }
    else if (k === SC.preview) { togglePreview(); }
    else if (k === SC.blackout){ e.preventDefault(); toggleBlackout(); }
  });

  function byId(rawId){ return S.segments.find(s=>s.id==rawId); }
  function swap(a,b)  { [S.segments[a],S.segments[b]]=[S.segments[b],S.segments[a]]; }
  function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }
  function esc(s)     { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadCfg().then(() => { renderList(); renderProgress(); setLive(false); loadSC(); });
}
</script>
</body>
</html>
