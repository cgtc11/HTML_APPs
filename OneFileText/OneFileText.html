<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFileText HTML</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Meiryo UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 32px;
    }
    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }
    .icon {
      display: inline-block;
      font-size: 24px;
      margin-right: 8px;
    }
    .note {
      color: #666;
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    #dropArea {
      border: 2px dashed #667eea;
      padding: 32px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 12px;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
      cursor: pointer;
    }
    #dropArea:hover {
      border-color: #764ba2;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    }
    #dropArea.hover {
      border-color: #764ba2;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
      transform: scale(1.02);
    }
    .dropText {
      color: #667eea;
      font-weight: 500;
      font-size: 16px;
    }
    .dropSubtext {
      color: #999;
      font-size: 12px;
      margin-top: 4px;
    }
    ul {
      list-style: none;
      margin-bottom: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    li {
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
      word-break: break-all;
      font-size: 13px;
      color: #333;
      transition: all 0.2s ease;
    }
    li:hover {
      background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%);
      border-color: #667eea;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
    }
    #concatButton {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    #concatButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    #concatButton:active {
      transform: translateY(0);
    }
    #clearButton {
      background: #e0e0e0;
      color: #666;
    }
    #clearButton:hover {
      background: #d0d0d0;
    }
    #fileInput {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #fileInput:hover {
      border-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="icon">📄</span>OneFileText</h1>
    <p class="note">テキストファイルをドラッグ＆ドロップ、または選択して追加。複数ファイルを1つにまとめてダウンロード。</p>
    <div id="dropArea">
      <div class="dropText">📁 ファイルをドラッグ＆ドロップ</div>
      <div class="dropSubtext">または下のボタンで選択</div>
    </div>
    <div class="actions">
      <input id="fileInput" type="file" multiple />
      <button id="concatButton">📥 ダウンロード</button>
      <button id="clearButton">✕ クリア</button>
    </div>
    <ul id="fileList"></ul>
  </div>

  <script>
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const concatButton = document.getElementById('concatButton');
    const clearButton = document.getElementById('clearButton');

    let files = [];

    function updateList() {
      fileList.innerHTML = '';
      files.forEach((file, idx) => {
        const li = document.createElement('li');
        li.textContent = file.name;
        fileList.appendChild(li);
      });
    }

    function addFiles(fileListData) {
      for (const file of fileListData) {
        if (!files.some(existing => existing.name === file.name && existing.size === file.size)) {
          files.push(file);
        }
      }
      updateList();
    }

    dropArea.addEventListener('dragover', (event) => {
      event.preventDefault();
      dropArea.classList.add('hover');
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.classList.remove('hover');
    });

    dropArea.addEventListener('drop', (event) => {
      event.preventDefault();
      dropArea.classList.remove('hover');
      addFiles(event.dataTransfer.files);
    });

    fileInput.addEventListener('change', (event) => {
      addFiles(event.target.files);
      fileInput.value = '';
    });

    clearButton.addEventListener('click', () => {
      files = [];
      updateList();
    });

    concatButton.addEventListener('click', async () => {
      if (files.length === 0) {
        alert('ファイルを追加してください。');
        return;
      }

      let output = '';
      for (const file of files) {
        const text = await file.text();
        output += file.name + '\n';
        output += '-'.repeat(50) + '\n';
        output += text + '\n';
        output += '-'.repeat(50) + '\n';
      }

      const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'combined.txt';
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
      alert('ファイルを結合してダウンロードしました。');
    });
  </script>
</body>
</html>
