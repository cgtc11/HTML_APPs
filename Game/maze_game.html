<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>迷路ゲーム</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0d0d1a;
  font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  color: #e0e0e0;
  touch-action: none;
}
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100dvh; /* dynamic viewport height: スマホのアドレスバーを除いた高さ */
  height: 100vh;  /* fallback */
}
#hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  gap: 8px;
  min-height: 44px;
}
#stage-label { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; }
#msg { font-size: 12px; color: #888; text-align: center; flex: 1; }
#btn-row { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
#cursor-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  color: #ccc;
  font-size: 12px;
  cursor: pointer;
}
#cursor-btn:hover { background: rgba(255,255,255,0.14); }
#cursor-btn.active {
  background: rgba(55,138,221,0.25);
  border-color: #378ADD;
  color: #7bbfff;
}
#reset-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  color: #ccc;
  font-size: 12px;
  cursor: pointer;
}
#reset-btn:hover { background: rgba(255,255,255,0.14); }
#next-btn {
  display: none;
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  background: #378ADD;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
#next-btn:hover { opacity: 0.85; }
#canvas-area {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  cursor: default;
}
#c {
  display: block;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  touch-action: none;
}
#cursor-canvas {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="stage-label">ステージ 1</span>
    <span id="msg">S の駒をドラッグしてゴールへ</span>
    <div id="btn-row">
      <button id="cursor-btn" class="active">👆 カーソルON</button>
      <button id="reset-btn">やり直す</button>
      <button id="next-btn">次のステージ →</button>
    </div>
  </div>
  <div id="canvas-area">
    <canvas id="c"></canvas>
    <canvas id="cursor-canvas"></canvas>
  </div>
</div>

<script>
const canvas      = document.getElementById('c');
const ctx         = canvas.getContext('2d');
const cursorCv    = document.getElementById('cursor-canvas');
const cursorCtx   = cursorCv.getContext('2d');
const canvasArea  = document.getElementById('canvas-area');
const msgEl       = document.getElementById('msg');
const stageLabelEl= document.getElementById('stage-label');
const cursorBtn   = document.getElementById('cursor-btn');
const nextBtn     = document.getElementById('next-btn');
const resetBtn    = document.getElementById('reset-btn');

let stage = 1;
let cols, rows, cellSize;
let maze, trail, piecePx, pieceCell;
let dragging    = false;
let cleared     = false;
let cursorPx    = null;
let showCursor  = false;  /* カーソル表示フラグ（デフォルト非表示） */

const PAL = {
  bg:          '#0d0d1a',
  wallInner:   '#3a4255',
  wallOuter:   '#5a6480',
  trail:       '#378ADD',
  piece:       '#E24B4A',
  pieceStroke: '#ff9090',
  startFill:   '#0d4a38',
  startRing:   '#1D9E75',
  goalFill:    '#5a3600',
  goalRing:    '#EF9F27',
  text:        '#ffffff',
};

/* ---- ステージ→グリッドサイズ ----
   画面に収まるセルサイズを基準に、ステージで変化させる。
   奇数グリッドにすると迷路の対称性がきれいになる。         */
function computeLayout() {
  const areaW = canvasArea.clientWidth;
  const areaH = canvasArea.clientHeight;

  /* セルサイズはステージで固定（広い画面でもステージ1は大きいマスのまま） */
  cellSize = stageTargetCellSize(stage);

  /* 画面に収まる奇数グリッド数を算出 */
  let c = Math.floor(areaW / cellSize);
  let r = Math.floor(areaH / cellSize);
  if (c < 5) c = 5;
  if (r < 5) r = 5;

  /* ステージ別の上限を適用（画面が広くてもマス数を増やしすぎない） */
  const {maxCols, maxRows} = stageMaxGrid(stage);
  if (c > maxCols) c = maxCols;
  if (r > maxRows) r = maxRows;

  if (c % 2 === 0) c--;  /* 奇数に */
  if (r % 2 === 0) r--;

  cols = c; rows = r;

  const W = cols * cellSize;
  const H = rows * cellSize;
  canvas.width  = W;
  canvas.height = H;

  cursorCv.width  = W;
  cursorCv.height = H;
}

/* セルサイズはステージ5相当で固定（難易度はループ数で制御） */
function stageTargetCellSize(s) {
  const sizes = [90, 70, 56, 44, 34, 28, 24, 20, 18];
  return sizes[Math.min(s - 1, sizes.length - 1)];
}

/* ステージ別の最大マス数（画面が広くてもこれ以上は増やさない） */
function stageMaxGrid(s) {
  const maxCols = [9, 11, 13, 17, 21, 25, 29, 33, 99];
  const maxRows = [7,  9, 11, 13, 17, 19, 21, 23, 99];
  const idx = Math.min(s - 1, maxCols.length - 1);
  return {maxCols: maxCols[idx], maxRows: maxRows[idx]};
}

/* ---- 迷路生成 ----
   1) 全セルを壁で埋める
   2) BFS(ランダム順)でS→Gの正解ルートを1本引いて開通・保護
   3) 正解ルートのセルを起点に行き止まり枝を生やす
      branchProb・maxDepth でステージごとに枝の密度を制御
      既に開いているセルへは繋がない → ループなし＝行き止まりだけ
   4) 孤立（閉じたまま）のセルは隣接通路と1箇所だけ強制接続
   ---------------------------------------------------------------- */
function generateMaze() {
  maze = Array.from({length: rows}, () =>
    Array.from({length: cols}, () => ({
      onAnswer: false,
      isOpen:   false,
      walls: {N:true, S:true, E:true, W:true}
    }))
  );

  const DIRS = [
    {dr:-1,dc:0,wall:'N',opp:'S'},
    {dr: 1,dc:0,wall:'S',opp:'N'},
    {dr: 0,dc:1,wall:'E',opp:'W'},
    {dr: 0,dc:-1,wall:'W',opp:'E'},
  ];

  function shuffle(arr) {
    for (let i=arr.length-1; i>0; i--) {
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function dirBetween(r1,c1,r2,c2) {
    if (r2===r1-1) return {wall:'N',opp:'S'};
    if (r2===r1+1) return {wall:'S',opp:'N'};
    if (c2===c1+1) return {wall:'E',opp:'W'};
    return {wall:'W',opp:'E'};
  }

  function openWall(r1,c1,r2,c2) {
    const {wall,opp}=dirBetween(r1,c1,r2,c2);
    maze[r1][c1].walls[wall]=false;
    maze[r2][c2].walls[opp] =false;
    maze[r1][c1].isOpen=true;
    maze[r2][c2].isOpen=true;
  }

  /* Step1: BFS(ランダム順)でS→Gの正解ルートを1本引く */
  {
    const par=Array.from({length:rows},()=>new Array(cols).fill(null));
    const vis=Array.from({length:rows},()=>new Array(cols).fill(false));
    const q=[{r:0,c:0}]; vis[0][0]=true;
    outer: while(q.length){
      const cur=q.shift();
      for(const d of shuffle([...DIRS])){
        const nr=cur.r+d.dr, nc=cur.c+d.dc;
        if(nr<0||nr>=rows||nc<0||nc>=cols||vis[nr][nc]) continue;
        vis[nr][nc]=true; par[nr][nc]={r:cur.r,c:cur.c};
        if(nr===rows-1&&nc===cols-1) break outer;
        q.push({r:nr,c:nc});
      }
    }
    /* 正解ルートを逆追跡して開通・保護マーク */
    let r=rows-1, c=cols-1;
    while(r!==0||c!==0){
      const p=par[r][c];
      openWall(p.r,p.c,r,c);
      maze[r][c].onAnswer=true;
      r=p.r; c=p.c;
    }
    maze[0][0].onAnswer=true;
    maze[0][0].isOpen=true;
    maze[rows-1][cols-1].isOpen=true;
  }

  /* Step2: 正解ルートから行き止まり枝を生やす */
  const branchProb = stageBranchProb(stage);
  const maxDepth   = stageBranchDepth(stage);

  function growBranch(sr, sc, depth) {
    if (depth <= 0) return;
    for (const d of shuffle([...DIRS])) {
      const nr=sr+d.dr, nc=sc+d.dc;
      if (nr<0||nr>=rows||nc<0||nc>=cols) continue;
      if (maze[nr][nc].isOpen) continue;      /* 既存通路に繋がない＝ループなし */
      if (Math.random() > branchProb) continue;
      openWall(sr,sc,nr,nc);
      growBranch(nr,nc,depth-1);
    }
  }

  /* 正解ルート上の全セルから枝を生やす */
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      if (maze[r][c].onAnswer) growBranch(r,c,maxDepth);
    }
  }

  /* 高ステージは枝から更に枝を生やして密にする */
  if (stage >= 4) {
    for (let r=0; r<rows; r++) {
      for (let c=0; c<cols; c++) {
        if (maze[r][c].isOpen && !maze[r][c].onAnswer) {
          growBranch(r,c,Math.max(1, maxDepth-2));
        }
      }
    }
  }

  /* Step3: 孤立セル（全壁で閉じたまま）を隣接通路と1箇所だけ強制接続 */
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      if (maze[r][c].isOpen) continue;
      for (const d of shuffle([...DIRS])) {
        const nr=r+d.dr, nc=c+d.dc;
        if (nr<0||nr>=rows||nc<0||nc>=cols||!maze[nr][nc].isOpen) continue;
        openWall(r,c,nr,nc);
        growBranch(r,c,Math.max(1,maxDepth-3));
        break;
      }
    }
  }
}

/* ステージ別 枝を伸ばす確率（低いほど行き止まりが短く少ない） */
function stageBranchProb(s) {
  const p=[0.20, 0.35, 0.50, 0.65, 0.80, 0.88, 0.93, 0.96, 0.99];
  return p[Math.min(s-1, p.length-1)];
}

/* ステージ別 枝の最大深さ */
function stageBranchDepth(s) {
  const d=[2, 3, 5, 7, 10, 13, 16, 20, 99];
  return d[Math.min(s-1, d.length-1)];
}

function cellCenter(r, c) {
  return {x: c * cellSize + cellSize / 2, y: r * cellSize + cellSize / 2};
}

/* ---- 描画 ---- */
function drawMaze() {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const wallW     = Math.max(1, cellSize * 0.08);
  const wallWOuter= Math.max(2, cellSize * 0.12);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cellSize, y = r * cellSize, s = cellSize;
      const w = maze[r][c].walls;
      const dw = (exists, edge, x1,y1,x2,y2) => {
        if (!exists) return;
        ctx.strokeStyle = edge ? PAL.wallOuter : PAL.wallInner;
        ctx.lineWidth   = edge ? wallWOuter : wallW;
        ctx.lineCap = 'square';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      };
      dw(w.N, r===0,        x,   y,   x+s, y  );
      dw(w.S, r===rows-1,   x,   y+s, x+s, y+s);
      dw(w.W, c===0,        x,   y,   x,   y+s);
      dw(w.E, c===cols-1,   x+s, y,   x+s, y+s);
    }
  }

  /* S / G ラベル */
  const drawLabel = (r, c, letter, fc, rc) => {
    const cen = cellCenter(r, c);
    const rad = cellSize * 0.34;
    const fs  = Math.max(8, Math.floor(cellSize * 0.28));
    ctx.fillStyle = fc;
    ctx.beginPath(); ctx.arc(cen.x, cen.y, rad, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = rc; ctx.lineWidth = Math.max(1, cellSize * 0.06);
    ctx.beginPath(); ctx.arc(cen.x, cen.y, rad, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = PAL.text;
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(letter, cen.x, cen.y);
  };
  drawLabel(0,       0,       'S', PAL.startFill, PAL.startRing);
  drawLabel(rows-1, cols-1,   'G', PAL.goalFill,  PAL.goalRing);
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.strokeStyle = PAL.trail;
  ctx.lineWidth   = Math.max(2, cellSize * 0.2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = PAL.trail; ctx.shadowBlur = Math.max(4, cellSize * 0.3);
  ctx.beginPath();
  ctx.moveTo(trail[0].x, trail[0].y);
  for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
  ctx.stroke();
  ctx.restore();
}

function drawPiece() {
  if (!piecePx) return;
  const rad = Math.max(4, cellSize * 0.26);
  ctx.save();
  ctx.shadowColor = PAL.piece; ctx.shadowBlur = Math.max(6, cellSize * 0.4);
  ctx.fillStyle = PAL.piece;
  ctx.beginPath(); ctx.arc(piecePx.x, piecePx.y, rad, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = PAL.pieceStroke; ctx.lineWidth = Math.max(1, cellSize * 0.05);
  ctx.beginPath(); ctx.arc(piecePx.x, piecePx.y, rad, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function render() {
  drawMaze();
  drawTrail();
  drawPiece();
}

/* ---- カスタムカーソル（指型）---- */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r);
  c.closePath();
}

function drawCursor() {
  cursorCtx.clearRect(0, 0, cursorCv.width, cursorCv.height);
  if (!cursorPx || !showCursor) return;

  /* cursorPxはcanvas座標（mazecanvasと同一座標系） */
  const cx = cursorPx.x, cy = cursorPx.y;
  const sc = Math.max(0.5, Math.min(1.4, cellSize / 24));

  cursorCtx.save();
  cursorCtx.translate(cx, cy);
  cursorCtx.scale(sc, sc);

  const skin   = dragging ? '#ffcc88' : '#ffe0b0';
  const stroke = '#a06020';
  cursorCtx.fillStyle   = skin;
  cursorCtx.strokeStyle = stroke;
  cursorCtx.lineWidth   = 1.5 / sc;

  const fingers = [
    {x:-10, y: dragging?-20:-28, w:6, h: dragging?14:20, r:3},
    {x: -3, y: dragging?-22:-32, w:6, h: dragging?16:24, r:3},
    {x:  4, y: dragging?-22:-32, w:6, h: dragging?16:24, r:3},
    {x: 11, y: dragging?-20:-30, w:6, h: dragging?14:20, r:3},
  ];
  fingers.forEach(f => {
    roundRect(cursorCtx, f.x, f.y, f.w, f.h, f.r);
    cursorCtx.fill(); cursorCtx.stroke();
  });
  roundRect(cursorCtx, -12, -14, 30, 22, 7);
  cursorCtx.fill(); cursorCtx.stroke();
  roundRect(cursorCtx, -20, -10, 9, 14, 4);
  cursorCtx.fill(); cursorCtx.stroke();

  cursorCtx.restore();
}

/* ---- 座標変換 ---- */
function eventToCanvasPos(e) {
  const src   = e.touches ? e.touches[0] : e;
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function pixelToCell(px) {
  return {
    r: Math.max(0, Math.min(rows-1, Math.floor(px.y / cellSize))),
    c: Math.max(0, Math.min(cols-1, Math.floor(px.x / cellSize))),
  };
}

function canMove(r1, c1, r2, c2) {
  const dr = r2-r1, dc = c2-c1;
  if (Math.abs(dr) + Math.abs(dc) !== 1) return false;
  if (dr===-1) return !maze[r1][c1].walls.N;
  if (dr=== 1) return !maze[r1][c1].walls.S;
  if (dc=== 1) return !maze[r1][c1].walls.E;
  if (dc===-1) return !maze[r1][c1].walls.W;
  return false;
}

/* trailCells: 通過済みセルの集合（キー = "r,c"）*/
let trailCells = new Set();

function addToTrail(r, c) {
  const cen = cellCenter(r, c);
  const last = trail[trail.length - 1];
  if (!last || last.x !== cen.x || last.y !== cen.y) {
    trail.push({x: cen.x, y: cen.y});
  }
  trailCells.add(r + ',' + c);
}

function inTrail(r, c) {
  return trailCells.has(r + ',' + c);
}

function tryMove(targetR, targetC) {
  const cr = pieceCell.r, cc = pieceCell.c;
  if (targetR === cr && targetC === cc) return;

  /* 移動は必ず隣接1マス＋壁なしのみ（ワープなし＝斜め線にならない） */
  if (!canMove(cr, cc, targetR, targetC)) return;
  pieceCell = {r: targetR, c: targetC};
  piecePx   = cellCenter(targetR, targetC);
  addToTrail(targetR, targetC);
  checkGoal(targetR, targetC);
}

function checkGoal(r, c) {
  if (r === rows-1 && c === cols-1) {
    cleared  = true;
    dragging = false;
    render(); drawCursor();
    msgEl.textContent = '🎉 クリア！';
    nextBtn.style.display = 'inline-block';
  }
}

/* ---- イベント ---- */
function onStart(e) {
  e.preventDefault();
  if (cleared) return;
  const cpos = eventToCanvasPos(e);
  const cell = pixelToCell(cpos);
  cursorPx   = cpos;

  if (!piecePx && cell.r === 0 && cell.c === 0) {
    pieceCell  = {r:0, c:0};
    trail      = [];
    trailCells = new Set();
    addToTrail(0, 0);
    piecePx    = cellCenter(0, 0);
    dragging   = true;
  } else if (piecePx && pieceCell && cell.r === pieceCell.r && cell.c === pieceCell.c) {
    dragging = true;
  } else if (piecePx && inTrail(cell.r, cell.c)) {
    /* 通過済みセルをタッチ→そこに駒をワープして掴む */
    pieceCell = {r: cell.r, c: cell.c};
    piecePx   = cellCenter(cell.r, cell.c);
    dragging  = true;
  }
  prevMovePx = null;
  render(); drawCursor();
}

/* 前フレームのcanvas座標（補間用） */
let prevMovePx = null;

function onMove(e) {
  e.preventDefault();
  const cpos = eventToCanvasPos(e);
  cursorPx   = cpos;

  if (dragging && !cleared) {
    const from  = prevMovePx || cpos;
    const dx    = cpos.x - from.x;
    const dy    = cpos.y - from.y;
    const dist  = Math.sqrt(dx*dx + dy*dy);
    const step  = Math.max(1, cellSize / 2);
    const steps = Math.max(1, Math.ceil(dist / step));
    for (let i = 1; i <= steps; i++) {
      if (cleared) break;
      const t    = i / steps;
      const cell = pixelToCell({x: from.x + dx*t, y: from.y + dy*t});
      tryMove(cell.r, cell.c);
    }
  }
  prevMovePx = cpos;
  render();
  drawCursor();
}

function onEnd(e) {
  e.preventDefault();
  dragging   = false;
  prevMovePx = null;
  drawCursor();
}

function onLeave(e) {
  cursorPx   = null;
  dragging   = false;
  prevMovePx = null;
  drawCursor();
}

canvasArea.addEventListener('mousedown',  onStart);
canvasArea.addEventListener('mousemove',  onMove);
canvasArea.addEventListener('mouseup',    onEnd);
canvasArea.addEventListener('mouseleave', onLeave);
canvasArea.addEventListener('touchstart', onStart, {passive:false});
canvasArea.addEventListener('touchmove',  onMove,  {passive:false});
canvasArea.addEventListener('touchend',   onEnd,   {passive:false});

cursorBtn.addEventListener('click', () => {
  showCursor = !showCursor;
  cursorBtn.textContent = showCursor ? '👆 カーソルOFF' : '👆 カーソルON';
  cursorBtn.classList.toggle('active', !showCursor);
  /* canvas-areaのcursor: noneも切り替え */
  canvasArea.style.cursor = showCursor ? 'none' : 'default';
  drawCursor();
});


nextBtn.addEventListener('click', () => {
  stage++;
  stageLabelEl.textContent = `ステージ ${stage}`;
  nextBtn.style.display = 'none';
  msgEl.textContent = 'S の駒をドラッグしてゴールへ';
  startGame();
});

resetBtn.addEventListener('click', () => {
  nextBtn.style.display = 'none';
  msgEl.textContent = 'S の駒をドラッグしてゴールへ';
  startGame();
});

/* リサイズ対応 */
window.addEventListener('resize', () => {
  startGame();
});

function startGame() {
  cleared   = false;
  dragging  = false;
  piecePx   = null;
  pieceCell = null;
  trail      = [];
  trailCells = new Set();
  computeLayout();
  generateMaze();
  render();
  drawCursor();
}

startGame();
</script>
</body>
