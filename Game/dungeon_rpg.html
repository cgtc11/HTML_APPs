<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剣と魔法の迷宮</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c8a84b;--gold-dim:#8a6f2e;--dark:#0a0c0f;--dark2:#111418;--dark3:#1a1e25;
  --dark4:#232830;--text:#d4c9a8;--text-dim:#8a7f60;
  --hp-red:#c0392b;--mp-blue:#2980b9;--green-bright:#27ae60;--border:#2a2e35;
}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Crimson Pro',serif;font-size:16px}
body{display:flex;justify-content:center;align-items:flex-start;padding:0}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;background:var(--dark2);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.screen{display:none;flex-direction:column;flex:1;min-height:100vh}
.screen.active{display:flex}
.title-font{font-family:'UnifrakturMaguntia',cursive}
button{cursor:pointer;font-family:'Crimson Pro',serif}

/* ===== SHARED ===== */
.page-header{background:var(--dark3);border-bottom:1px solid var(--gold-dim);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-family:'UnifrakturMaguntia',cursive;font-size:22px;color:var(--gold)}
.back-btn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;font-size:13px;border-radius:4px;transition:all .15s}
.back-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.scroll-body{flex:1;overflow-y:auto;padding:14px 16px}
.section-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.bar-wrap{display:flex;align-items:center;gap:8px;margin-top:3px}
.bar{height:8px;border-radius:4px;background:var(--dark4);flex:1;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.hp-fill{background:var(--hp-red)}
.mp-fill{background:var(--mp-blue)}
.bar-text{font-size:11px;color:var(--text-dim);min-width:64px;text-align:right}
.bar-label{font-size:10px;color:var(--text-dim);width:22px}
.gold-badge{font-size:12px;color:var(--gold)}
.log-area{background:var(--dark);border-top:1px solid var(--border);padding:10px 16px;height:96px;overflow-y:auto;flex-shrink:0}
.log-line{font-size:13px;color:var(--text-dim);line-height:1.55}
.log-line.imp{color:var(--text)}
.log-line.good{color:var(--green-bright)}
.log-line.bad{color:var(--hp-red)}
.log-line.gold{color:var(--gold)}

/* ===== CREATE ===== */
#create-screen{background:var(--dark2)}
.create-hero{background:var(--dark3);border-bottom:1px solid var(--gold-dim);padding:20px 16px;text-align:center}
.create-hero .big{font-family:'UnifrakturMaguntia',cursive;font-size:30px;color:var(--gold)}
.create-hero .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.create-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.form-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;display:block}
.form-input{background:var(--dark3);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-family:'Crimson Pro',serif;font-size:15px;border-radius:4px;outline:none;width:100%}
.form-input:focus{border-color:var(--gold-dim)}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.class-card{background:var(--dark3);border:1px solid var(--border);padding:10px;cursor:pointer;border-radius:4px;transition:all .15s;text-align:center}
.class-card:hover,.class-card.sel{border-color:var(--gold-dim)}
.class-card.sel{border-color:var(--gold);background:var(--dark4)}
.class-emoji{font-size:26px;display:block;margin-bottom:4px}
.class-name{font-size:13px;color:var(--gold);font-weight:600}
.class-stats{font-size:10px;color:var(--text-dim);margin-top:3px}
.start-btn{background:rgba(200,168,75,.15);border:1px solid var(--gold-dim);color:var(--gold);padding:13px;font-size:16px;border-radius:4px;transition:all .15s;width:100%;margin-top:4px}
.start-btn:hover{background:rgba(200,168,75,.25)}

/* ===== TAVERN ===== */
#tavern-screen{background:var(--dark2)}
.char-panel{background:var(--dark3);border-bottom:1px solid var(--border);padding:12px 16px;flex-shrink:0}
.char-name{font-size:19px;color:var(--gold);font-weight:600}
.char-sub{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat-box{display:flex;flex-direction:column;align-items:center;min-width:42px}
.stat-l{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat-v{font-size:16px;font-weight:600}
.menu-body{padding:12px 16px;flex:1}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-btn{background:var(--dark3);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:4px;transition:all .15s;text-align:left;display:flex;align-items:center;gap:8px}
.menu-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.menu-btn.full{grid-column:1/-1}
.menu-btn.accent{border-color:var(--gold-dim);color:var(--gold)}
.menu-btn.accent:hover{background:rgba(200,168,75,.1)}
.menu-btn .mi{font-size:22px;min-width:26px}
.menu-btn .ml{font-size:14px;font-weight:600;display:block}
.menu-btn .ms{font-size:11px;color:var(--text-dim);display:block;margin-top:1px}
.menu-btn:hover .ms{color:var(--gold-dim)}

/* ===== DUNGEON SELECT ===== */
#dselect-screen .scroll-body{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--dark3);border:1px solid var(--border);padding:12px 14px;cursor:pointer;border-radius:4px;transition:all .15s}
.dcard:hover{border-color:var(--gold-dim)}
.dcard.locked{opacity:.4;cursor:not-allowed}
.dcard-head{display:flex;justify-content:space-between;align-items:flex-start}
.dcard-name{font-size:16px;color:var(--gold);font-weight:600}
.dcard-floor{font-size:11px;color:var(--text-dim)}
.dcard-desc{font-size:12px;color:var(--text-dim);margin-top:4px}
.tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:2px;border:1px solid}
.tag-e{border-color:#27ae60;color:#27ae60}
.tag-m{border-color:#f39c12;color:#f39c12}
.tag-h{border-color:#c0392b;color:#c0392b}
.tag-x{border-color:#8e44ad;color:#8e44ad}
.tag-g{border-color:var(--gold-dim);color:var(--gold)}
.tag-l{border-color:#c0392b;color:#c0392b}

/* ===== BATTLE ===== */
#battle-screen{background:var(--dark)}
.battle-header{background:var(--dark2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.battle-dname{font-size:12px;color:var(--text-dim)}
.battle-depth{font-size:14px;color:var(--gold);font-weight:600}
.battle-arena{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px 10px;flex:1}
.enemy-zone{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.enemy-sprite{font-size:64px;line-height:1;transition:transform .1s}
.enemy-sprite.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.enemy-name{font-size:17px;color:var(--gold);font-weight:600}
.enemy-hp-wrap{width:200px;height:9px;background:var(--dark4);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.enemy-hp-fill{height:100%;background:var(--hp-red);border-radius:4px;transition:width .4s}
.enemy-status{font-size:11px;color:var(--text-dim)}
.battle-log{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;width:100%;height:90px;overflow-y:auto;flex-shrink:0}
.bmsg{font-size:13px;line-height:1.6;color:var(--text-dim)}
.bmsg.player{color:#5dade2}
.bmsg.enemy{color:var(--hp-red)}
.bmsg.system{color:var(--gold)}
.bmsg.good{color:var(--green-bright)}
.bmsg.bad{color:var(--hp-red)}
.player-hud{background:var(--dark2);border-top:1px solid var(--border);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hud-bars{display:flex;flex-direction:column;gap:4px}
.hud-bar-row{display:flex;align-items:center;gap:6px;font-size:11px}
.hud-bar{height:7px;border-radius:3px;background:var(--dark4);width:130px;overflow:hidden}
.hud-bar-num{color:var(--text-dim);min-width:54px;text-align:right;font-size:11px}
.hud-right{text-align:right;font-size:12px;color:var(--text-dim)}
.actions{background:var(--dark2);border-top:1px solid var(--border);padding:10px 14px;flex-shrink:0}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.abtn{background:var(--dark3);border:1px solid var(--border);color:var(--text);padding:8px 4px;border-radius:4px;transition:all .15s;text-align:center;font-size:13px;line-height:1.2}
.abtn:hover:not(:disabled){border-color:var(--gold-dim);color:var(--gold);background:var(--dark4)}
.abtn:disabled{opacity:.35;cursor:not-allowed}
.abtn .ai{display:block;font-size:20px;margin-bottom:2px}
.abtn .al{font-size:10px;display:block}

/* ===== RESULT ===== */
#result-screen{background:var(--dark2);align-items:center;text-align:center;padding:20px 16px}
.result-title{font-family:'UnifrakturMaguntia',cursive;font-size:32px;margin-bottom:4px}
.result-title.win{color:var(--gold)}
.result-title.lose{color:var(--hp-red)}
.result-sub{font-size:13px;color:var(--text-dim);margin-bottom:10px}
.lvup-banner{background:rgba(200,168,75,.1);border:1px solid var(--gold-dim);border-radius:4px;padding:9px;margin:6px auto;width:100%;max-width:300px;color:var(--gold);font-size:14px;font-weight:600}
.reward-box{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:12px;width:100%;max-width:300px;margin:8px auto;text-align:left}
.ritem{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--border)}
.ritem:last-child{border-bottom:none}
.rl{color:var(--text-dim)}
.rv{font-weight:600}
.rv.g{color:var(--gold)}
.rv.e{color:#8e44ad}
.rv.h{color:var(--hp-red)}
.result-btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.rbtn{background:var(--dark3);border:1px solid var(--border);color:var(--text);padding:10px 18px;font-size:14px;border-radius:4px;transition:all .15s}
.rbtn:hover{border-color:var(--gold-dim);color:var(--gold)}
.rbtn.pri{border-color:var(--gold-dim);color:var(--gold)}
.rbtn.pri:hover{background:rgba(200,168,75,.1)}

/* ===== ITEMS ===== */
#items-screen{background:var(--dark2)}
.items-body{padding:14px 16px;flex:1;overflow-y:auto}
.inv-row{background:var(--dark3);border:1px solid var(--border);padding:10px 12px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inv-name{font-size:14px}
.inv-desc{font-size:11px;color:var(--text-dim)}
.inv-use{background:none;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;font-size:12px;border-radius:3px;transition:all .15s}
.inv-use:hover{border-color:var(--gold-dim);color:var(--gold)}
.no-items{color:var(--text-dim);font-size:13px;text-align:center;padding:16px 0}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sitem{background:var(--dark3);border:1px solid var(--border);padding:10px;border-radius:4px;cursor:pointer;transition:all .15s}
.sitem:hover{border-color:var(--gold-dim)}
.sitem-top{display:flex;justify-content:space-between;margin-bottom:3px}
.sitem-name{font-size:14px}
.sitem-price{font-size:13px;color:var(--gold)}
.sitem-desc{font-size:11px;color:var(--text-dim)}

/* ===== SAVE/LOAD ===== */
#saveload-screen{background:var(--dark2)}
.sl-tabs{display:flex;border-bottom:1px solid var(--border)}
.sl-tab{flex:1;padding:10px;text-align:center;font-size:14px;cursor:pointer;color:var(--text-dim);border:none;background:none;font-family:'Crimson Pro',serif;transition:all .15s;border-bottom:2px solid transparent}
.sl-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.sl-tab:hover{color:var(--text)}
.slot-list{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.slot-card{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot-card.empty .slot-info{color:var(--text-dim);font-size:13px}
.slot-num{font-size:11px;color:var(--text-dim);min-width:44px}
.slot-info{flex:1}
.slot-name{font-size:15px;color:var(--gold);font-weight:600}
.slot-detail{font-size:11px;color:var(--text-dim);margin-top:2px}
.slot-date{font-size:10px;color:var(--text-dim);margin-top:2px}
.slot-btn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;font-size:12px;border-radius:3px;transition:all .15s;font-family:'Crimson Pro',serif;white-space:nowrap}
.slot-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.slot-btn.danger:hover{border-color:var(--hp-red);color:var(--hp-red)}
.slot-btn.disabled{opacity:.35;cursor:not-allowed}

/* ===== STATUS ===== */
#status-screen{background:var(--dark2)}
.status-body{padding:14px 16px;flex:1;overflow-y:auto}
.status-card{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:10px}
.status-card-title{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:5px}
.stat-table{width:100%;border-collapse:collapse}
.stat-table td{padding:5px 0;font-size:14px}
.stat-table td:first-child{color:var(--text-dim);width:40%}
.stat-table td:last-child{color:var(--text);font-weight:600}
.skill-tag{display:inline-block;background:rgba(200,168,75,.1);border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;padding:3px 9px;border-radius:3px;margin:3px 3px 0 0}
</style>
</head>
<body>
<div id="app">

<!-- ===== CHARACTER CREATE ===== -->
<div id="create-screen" class="screen active">
  <div class="create-hero">
    <div class="big">剣と魔法の迷宮</div>
    <div class="sub">— Dungeon Chronicle —</div>
  </div>
  <div class="create-body">
    <div>
      <label class="form-label">冒険者の名前</label>
      <input class="form-input" id="charNameInput" placeholder="名前を入力…" value="アリス" maxlength="12">
    </div>
    <div>
      <label class="form-label">職業を選択</label>
      <div class="class-grid" id="classGrid"></div>
    </div>
    <button class="start-btn" onclick="startGame()">⚔ 冒険を始める</button>
    <button class="start-btn" style="background:rgba(41,128,185,.15);border-color:#2980b9;color:#5dade2;margin-top:6px" onclick="openSaveLoad('load')">📂 セーブデータをロード</button>
  </div>
</div>

<!-- ===== TAVERN ===== -->
<div id="tavern-screen" class="screen">
  <div class="page-header">
    <div class="page-title">黄金の杯亭</div>
    <div class="gold-badge">💰 <span id="tavernGold">0</span> G</div>
  </div>
  <div class="char-panel">
    <div class="char-name" id="tavernName">—</div>
    <div class="char-sub" id="tavernSub">—</div>
    <div class="bar-wrap">
      <span class="bar-label">HP</span>
      <div class="bar"><div class="bar-fill hp-fill" id="tavernHpBar" style="width:100%"></div></div>
      <span class="bar-text" id="tavernHpText">—</span>
    </div>
    <div class="bar-wrap">
      <span class="bar-label">MP</span>
      <div class="bar"><div class="bar-fill mp-fill" id="tavernMpBar" style="width:100%"></div></div>
      <span class="bar-text" id="tavernMpText">—</span>
    </div>
    <div class="stat-row" id="tavernStats"></div>
  </div>
  <div class="menu-body">
    <div class="section-label" style="margin-bottom:10px">メニュー</div>
    <div class="menu-grid">
      <button class="menu-btn accent full" onclick="openDungeonSelect()">
        <span class="mi">⚔️</span>
        <span><span class="ml">ダンジョンへ出発</span><span class="ms">新たな探索へ</span></span>
      </button>
      <button class="menu-btn" onclick="doRest()">
        <span class="mi">🛏️</span>
        <span><span class="ml">宿に泊まる</span><span class="ms">HP/MP全快 50G</span></span>
      </button>
      <button class="menu-btn" onclick="openItems()">
        <span class="mi">🎒</span>
        <span><span class="ml">道具屋</span><span class="ms">購入・使用</span></span>
      </button>
      <button class="menu-btn" onclick="openStatus()">
        <span class="mi">📜</span>
        <span><span class="ml">ステータス</span><span class="ms">能力値・スキル</span></span>
      </button>
      <button class="menu-btn full" onclick="openSaveLoad('save')">
        <span class="mi">💾</span>
        <span><span class="ml">セーブ / ロード</span><span class="ms">冒険の記録を保存・読み込む</span></span>
      </button>
      <button class="menu-btn full" onclick="if(confirm('タイトルに戻りますか？（セーブ忘れずに）'))showScreen('create-screen')">
        <span class="mi">🏠</span>
        <span><span class="ml">タイトルへ戻る</span><span class="ms">キャラクター選択画面へ</span></span>
      </button>
    </div>
  </div>
  <div class="log-area" id="tavernLog">
    <div class="log-line imp">ようこそ、黄金の杯亭へ。</div>
  </div>
</div>

<!-- ===== DUNGEON SELECT ===== -->
<div id="dselect-screen" class="screen">
  <div class="page-header">
    <div class="page-title">ダンジョン選択</div>
    <button class="back-btn" onclick="showScreen('tavern-screen')">← 酒場へ</button>
  </div>
  <div class="scroll-body" id="dungeonList"></div>
</div>

<!-- ===== BATTLE ===== -->
<div id="battle-screen" class="screen">
  <div class="battle-header">
    <span class="battle-dname" id="battleDName">—</span>
    <span class="battle-depth">深度 <span id="battleFloor">1</span>F</span>
  </div>
  <div class="battle-arena">
    <div class="enemy-zone">
      <div class="enemy-sprite" id="enemySprite">👾</div>
      <div class="enemy-name" id="enemyName">—</div>
      <div class="enemy-hp-wrap"><div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div></div>
      <div class="enemy-status" id="enemyStatus">HP: — / —</div>
    </div>
    <div class="battle-log" id="battleLog"></div>
  </div>
  <div class="player-hud">
    <div class="hud-bars">
      <div class="hud-bar-row">
        <span class="bar-label">HP</span>
        <div class="hud-bar"><div class="bar-fill hp-fill" id="bHpBar" style="width:100%"></div></div>
        <span class="hud-bar-num" id="bHpText">—</span>
      </div>
      <div class="hud-bar-row">
        <span class="bar-label">MP</span>
        <div class="hud-bar"><div class="bar-fill mp-fill" id="bMpBar" style="width:100%"></div></div>
        <span class="hud-bar-num" id="bMpText">—</span>
      </div>
    </div>
    <div class="hud-right">
      Lv <span id="bLevel" style="color:var(--gold);font-size:16px;font-weight:600">1</span><br>
      <span id="bExpText" style="font-size:11px">EXP 0/30</span>
    </div>
  </div>
  <div class="actions">
    <div class="action-grid" id="actionGrid"></div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="result-screen" class="screen">
  <div class="result-title" id="resultTitle">Victory!</div>
  <div class="result-sub" id="resultSub">—</div>
  <div id="lvupArea"></div>
  <div class="reward-box" id="rewardBox"></div>
  <div class="result-btns" id="resultBtns"></div>
</div>

<!-- ===== ITEMS ===== -->
<div id="items-screen" class="screen">
  <div class="page-header">
    <div class="page-title">道具屋・荷物</div>
    <div class="gold-badge">💰 <span id="shopGold">0</span> G</div>
  </div>
  <div class="items-body">
    <div class="section-label">所持アイテム</div>
    <div id="inventoryList" style="margin-bottom:14px"></div>

   enemies:[
     {name:'デーモン',  emoji:'😈',hp:55,atk:24,def:12,exp:65,gold:45},
     {name:'地獄の炎',  emoji:'🔥',hp:40,atk:28,def:5, exp:58,gold:32,burn:true},
     {name:'暗黒騎士',  emoji:'🖤',hp:65,atk:26,def:16,exp:72,gold:52},

   ],

const SHOP_ITEMS = [
  {id:'potion',    name:'回復薬',   emoji:'🧪',desc:'HP +30 回復',       price:30,
   use:(p)=>{const h=Math.min(p.maxHp,p.hp+30)-p.hp;p.hp+=h;return `HP が ${h} 回復した！`}},
  {id:'elixir',    name:'エリクサー',emoji:'⚗️',desc:'HP/MP 全快',       price:120,
   use:(p)=>{p.hp=p.maxHp;p.mp=p.maxMp;return 'HP と MP が全快した！'}},
  {id:'antidote',  name:'解毒薬',   emoji:'💊',desc:'毒を解除する',      price:20,
   use:(p)=>{p.poisoned=false;p.poisonTurns=0;return '毒が解けた！'}},
  {id:'manapotion',name:'マナポーション',emoji:'💧',desc:'MP +20 回復', price:40,
   use:(p)=>{const m=Math.min(p.maxMp,p.mp+20)-p.mp;p.mp+=m;return `MP が ${m} 回復した！`}},
  {id:'strengthstone',name:'力の石',emoji:'💎',desc:'ATK +3 永続強化',  price:200,
   use:(p)=>{p.atk+=3;return 'ATK が 3 上がった！'}},
];

// ============================================================
//  STATE
// ============================================================
let P = null; // player
let G = {
  dungeon:null, floor:1,
  enemy:null, battleActive:false,
  defending:false, exposed:false, counterBoost:false, runFailed:false, poisonTurns:0,
  floorKills:0, floorKillsNeeded:3,
  isBoss:false,
  record:{kills:0,dungeons:0,gold:0}
};

// ============================================================
//  UTILS
// ============================================================
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const clamp = (v,mn,mx) => Math.max(mn,Math.min(mx,v));

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function tlog(msg,cls=''){
  const log=document.getElementById('tavernLog');
  const d=document.createElement('div');
  d.className='log-line'+(cls?' '+cls:'');
  d.textContent=msg;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
  while(log.children.length>40)log.removeChild(log.firstChild);
}

function blog(msg,cls=''){
  const log=document.getElementById('battleLog');
  const d=document.createElement('div');
  d.className='bmsg'+(cls?' '+cls:'');
  d.textContent=msg;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
  while(log.children.length>30)log.removeChild(log.firstChild);
}

// ============================================================
//  CHARACTER CREATE
// ============================================================
let selectedClassId='warrior';
function selectClass(id){
  selectedClassId=id;
  document.querySelectorAll('.class-card').forEach(c=>c.classList.toggle('sel',c.dataset.cid===id));
}

(function initClassGrid(){
  const el=document.getElementById('classGrid');
  el.innerHTML=CLASSES.map(c=>`
    <div class="class-card" data-cid="${c.id}" onclick="selectClass('${c.id}')">
      <span class="class-emoji">${c.emoji}</span>
      <div class="class-name">${c.name}</div>
      <div class="class-stats">${c.desc}</div>
    </div>`).join('');
  selectClass('warrior');
})();

function startGame(){
  const name=document.getElementById('charNameInput').value.trim()||'勇者';
  const cls=CLASSES.find(c=>c.id===selectedClassId);
  const s=cls.stats;
  P={
    name,cls,
    level:1,exp:0,expNext:30,
    maxHp:s.hp,hp:s.hp,
    maxMp:s.mp,mp:s.mp,
    atk:s.atk,def:s.def,spd:s.spd,int:s.int,
    gold:100,inventory:[{...SHOP_ITEMS[0]}],
    poisoned:false,poisonTurns:0,
  };
  G.record={kills:0,dungeons:0,gold:0};
  refreshTavern();
  showScreen('tavern-screen');
  tlog(`${name}、冒険の旅が始まった！`,'imp');
}

// ============================================================
//  TAVERN
// ============================================================
function refreshTavern(){
  document.getElementById('tavernGold').textContent=P.gold;
  document.getElementById('tavernName').textContent=`${P.name}（${P.cls.name}）`;
  document.getElementById('tavernSub').textContent=`Lv ${P.level}  EXP ${P.exp} / ${P.expNext}`;
  document.getElementById('tavernHpBar').style.width=(P.hp/P.maxHp*100)+'%';
  document.getElementById('tavernHpText').textContent=`${P.hp} / ${P.maxHp}`;
  document.getElementById('tavernMpBar').style.width=(P.mp/P.maxMp*100)+'%';
  document.getElementById('tavernMpText').textContent=`${P.mp} / ${P.maxMp}`;
  document.getElementById('tavernStats').innerHTML=
    [{l:'ATK',v:P.atk},{l:'DEF',v:P.def},{l:'SPD',v:P.spd},{l:'INT',v:P.int}]
    .map(s=>`<div class="stat-box"><span class="stat-l">${s.l}</span><span class="stat-v">${s.v}</span></div>`).join('');
}

function doRest(){
  if(P.hp>=P.maxHp&&P.mp>=P.maxMp){tlog('すでに万全の状態だ。');return;}
  if(P.gold<50){tlog('宿代（50G）が足りない！','bad');return;}
  P.gold-=50;P.hp=P.maxHp;P.mp=P.maxMp;P.poisoned=false;P.poisonTurns=0;
  refreshTavern();
  tlog('一夜の休息を取った。HP・MPが全快した！','good');
}

// ============================================================
//  DUNGEON SELECT
// ============================================================
function openDungeonSelect(){
  const el=document.getElementById('dungeonList');
  const tagMap={e:'初級',m:'中級',h:'上級',x:'経験値↑',g:'高報酬',l:'🔒'};
  el.innerHTML=DUNGEONS.map(d=>{
    const locked=P.level<d.minLv;
    const tags=d.tags.map(t=>`<span class="tag tag-${t}">${tagMap[t]||t}</span>`).join('');
    const lockTag=locked?`<span class="tag tag-l">Lv${d.minLv}〜</span>`:'';
    const clickAttr=locked?'':'onclick="enterDungeon(\''+d.id+'\')"';
    return`<div class="dcard${locked?' locked':''}" ${clickAttr}>
      <div class="dcard-head">
        <div class="dcard-name">${d.name}</div>
        <div class="dcard-floor">${d.floors}F</div>
      </div>
      <div class="dcard-desc">${d.desc}</div>
      <div class="tags">${tags}${lockTag}</div>
    </div>`;
  }).join('');
  showScreen('dselect-screen');
}

// ============================================================
//  BATTLE SETUP
// ============================================================
function enterDungeon(id){
  if(P.hp<=0){tlog('戦えない状態だ！','bad');showScreen('tavern-screen');return;}
  G.dungeon=DUNGEONS.find(d=>d.id===id);
  G.floor=1;G.floorKills=0;G.floorKillsNeeded=rand(2,4);G.isBoss=false;
  P.poisoned=false;P.poisonTurns=0;G.defending=false;
  buildActionGrid();
  nextEncounter();
}

function buildActionGrid(){
  const skills=P.cls.skills;
  const grid=document.getElementById('actionGrid');
  grid.innerHTML=`
    <button class="abtn" id="btnAtk" onclick="doAttack()"><span class="ai">⚔️</span><span class="al">攻撃</span></button>
    ${skills.map((sk,i)=>`<button class="abtn" id="btnSk${i}" onclick="doSkill(${i})"><span class="ai">${sk.icon}</span><span class="al">${sk.name}</span></button>`).join('')}
    <button class="abtn" id="btnItem" onclick="useBattleItem()"><span class="ai">🎒</span><span class="al">道具</span></button>
    <button class="abtn" id="btnRun"  onclick="doRun()"><span class="ai">💨</span><span class="al">逃走</span></button>`;
}

function nextEncounter(){
  const d=G.dungeon;
  document.getElementById('battleDName').textContent=d.name;
  document.getElementById('battleFloor').textContent=G.floor;

  let enemy;
  if(G.floor===d.floors&&G.floorKills>=G.floorKillsNeeded){
    enemy={...d.boss};G.isBoss=true;
  } else if(G.floorKills>=G.floorKillsNeeded){
    G.floor++;G.floorKills=0;G.floorKillsNeeded=rand(2,4);G.isBoss=false;
    document.getElementById('battleFloor').textContent=G.floor;
    enemy=scaledEnemy();
    blog(`── ${G.floor}F に到達 ──`,'system');
  } else {
    enemy=scaledEnemy();
  }

  enemy.maxHp=enemy.hp;
  G.enemy=enemy;G.battleActive=true;G.defending=false;
  setActions(true);
  updateEnemyUI();updatePlayerHud();
  document.getElementById('battleLog').innerHTML='';
  blog(enemy.isBoss?`⚠ BOSS ${enemy.name} が現れた！`:`${enemy.name} が現れた！`,'system');
  showScreen('battle-screen');
}

function scaledEnemy(){
  const arr=G.dungeon.enemies;
  const e={...arr[rand(0,arr.length-1)]};
  const m=1+G.floor*0.14;
  e.hp=Math.round(e.hp*m);e.atk=Math.round(e.atk*m*0.75);
  e.def=Math.round(e.def*m*0.5);e.exp=Math.round(e.exp*m);e.gold=Math.round(e.gold*m);
  return e;
}

// ============================================================
//  BATTLE ACTIONS
// ============================================================
function setActions(v){document.querySelectorAll('.abtn').forEach(b=>b.disabled=!v);}

function calcDmg(atk,def,variance=0.25){
  const base=Math.max(1,atk-def);
  return Math.max(1,Math.round(base*(0.85+Math.random()*0.3)));
}

function shakeEnemy(){
  const el=document.getElementById('enemySprite');
  el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
}

function updateEnemyUI(){
  const e=G.enemy;
  document.getElementById('enemySprite').textContent=e.emoji;
  document.getElementById('enemyName').textContent=e.name+(e.isBoss?' 【BOSS】':'');
  const pct=Math.max(0,e.hp/e.maxHp*100);
  document.getElementById('enemyHpFill').style.width=pct+'%';
  document.getElementById('enemyStatus').textContent=`HP: ${Math.max(0,e.hp)} / ${e.maxHp}`;
}

function updatePlayerHud(){
  document.getElementById('bHpBar').style.width=(P.hp/P.maxHp*100)+'%';
  document.getElementById('bHpText').textContent=`${P.hp}/${P.maxHp}`;
  document.getElementById('bMpBar').style.width=(P.mp/P.maxMp*100)+'%';
  document.getElementById('bMpText').textContent=`${P.mp}/${P.maxMp}`;
  document.getElementById('bLevel').textContent=P.level;
  document.getElementById('bExpText').textContent=`EXP ${P.exp}/${P.expNext}`;
}

function doAttack(){
  if(!G.battleActive)return;
  setActions(false);
  const boost=G.counterBoost||false;
  G.counterBoost=false;
  const crit=Math.random()<(P.cls.id==='rogue'?0.25:0.1);
  let dmg=calcDmg(P.atk*(boost?2:1),G.enemy.def);
  if(crit){dmg=Math.round(dmg*1.8);blog(`💥 クリティカル！ ${dmg} ダメージ！`+(boost?' (防御後強化)':''),'player');}
  else blog(`${P.name} の攻撃！ ${dmg} ダメージ！`+(boost?' ⚡防御後強化×2':''),'player');
  G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();
  setTimeout(checkResult,700);
}

function doSkill(i){
  if(!G.battleActive)return;
  const sk=P.cls.skills[i];
  if(sk.cost>0&&P.mp<sk.cost){blog('MP が足りない！','bad');return;}
  setActions(false);
  G.counterBoost=false;
  if(sk.cost>0){P.mp=Math.max(0,P.mp-sk.cost);updatePlayerHud();}

  const id=P.cls.id;
  const name=sk.name;
  if(name==='渾身の一撃'){
    const dmg=calcDmg(P.atk*2,G.enemy.def);
    blog(`${name}！ ${dmg} の大ダメージ！（次ターン隙が生じる）`,'player');
    G.exposed=true;
    G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  } else if(name==='防御姿勢'){
    G.defending=true;blog(`${P.name} は防御姿勢をとった。`,'player');setTimeout(enemyTurn,700);
  } else if(name==='ファイアボール'){
    const dmg=calcDmg(P.int*3,G.enemy.def);
    blog(`🔥 ファイアボール！ ${dmg} の魔法ダメージ！`,'player');
    G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  } else if(name==='アイスランス'){
    const dmg=calcDmg(P.int*2.5,G.enemy.def);
    blog(`❄️ アイスランス！ ${dmg} の魔法ダメージ！`,'player');
    G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  } else if(name==='急所狙い'){
    const dmg=calcDmg(P.atk*1.5,0);
    blog(`🎯 急所！ ${dmg} ダメージ！（防御無視）`,'player');
    G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  } else if(name==='毒手'){
    const dmg=calcDmg(P.atk,G.enemy.def);
    blog(`☠️ 毒手！ ${dmg} ダメージ＋毒！`,'player');
    G.enemy.hp-=dmg;G.enemy.poisoned=true;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  } else if(name==='ヒール'){
    const heal=Math.round(P.int*2+10);P.hp=Math.min(P.maxHp,P.hp+heal);
    blog(`💚 ヒール！ HP ${heal} 回復！`,'good');updatePlayerHud();setTimeout(enemyTurn,700);
  } else if(name==='ホーリーライト'){
    const dmg=calcDmg(P.int*3.5,G.enemy.def);
    blog(`⭐ ホーリーライト！ ${dmg} の神聖ダメージ！`,'player');
    G.enemy.hp-=dmg;shakeEnemy();updateEnemyUI();setTimeout(checkResult,700);
  }
}

function useBattleItem(){
  if(!G.battleActive)return;
  if(P.inventory.length===0){blog('アイテムがない！','bad');return;}
  setActions(false);
  const item=P.inventory.shift();
  const msg=item.use(P);
  blog(`🎒 ${item.name} を使った。${msg}`,'good');
  updatePlayerHud();
  setTimeout(enemyTurn,700);
}

function doRun(){
  if(!G.battleActive)return;
  setActions(false);
  const rate=P.cls.id==='rogue'?0.8:0.5;
  if(Math.random()<rate){
    blog('逃走に成功した！','good');
    G.battleActive=false;
    setTimeout(()=>{showScreen('tavern-screen');refreshTavern();tlog('逃走して酒場に戻った。');},800);
  } else {
    blog('逃走に失敗した！隙を突かれた！','bad');
    G.runFailed=true;
    setTimeout(enemyTurn,700);
  }
}

// ============================================================
//  ENEMY TURN
// ============================================================
function enemyTurn(){
  if(!G.battleActive)return;
  const e=G.enemy;
  const wasDefending=G.defending;
  const defMult=G.defending?2:(G.exposed?0.5:1);
  const runFailed=G.runFailed||false;
  G.defending=false;
  G.exposed=false;
  G.runFailed=false;

  // 防御時：魔法（drain/burn系）は跳ね返す
  if(wasDefending&&(e.drain||e.burn)){
    const reflect=Math.round(calcDmg(e.atk,0)*0.8);
    e.hp=Math.max(0,e.hp-reflect);
    blog(`✨ 魔法を跳ね返した！ ${e.name} に ${reflect} ダメージ！`,'good');
    updateEnemyUI();
    if(e.hp<=0){P.hp=Math.max(0,P.hp);updatePlayerHud();setTimeout(checkResult,400);return;}
    P.hp=Math.max(0,P.hp);updatePlayerHud();setActions(true);
    // 防御後は次ターン攻撃力2倍フラグ
    G.counterBoost=true;
    return;
  }

  let dmg=calcDmg(e.atk,P.def*defMult);
  if(runFailed)dmg=dmg*2;

  if(e.drain){
    dmg=Math.max(1,Math.round(dmg*0.8));
    const drain=Math.round(dmg*0.3);
    P.hp-=dmg;e.hp=Math.min(e.maxHp,e.hp+drain);
    blog(`${e.name} の吸血！ ${dmg} ダメージ（${drain}回復）`+(runFailed?' ×2倍！':''),'enemy');
    updateEnemyUI();
  } else if(e.poison&&Math.random()<0.35&&!P.poisoned){
    P.hp-=dmg;P.poisoned=true;P.poisonTurns=4;
    blog(`${e.name} の毒攻撃！ ${dmg} ダメージ！毒状態に…`+(runFailed?' ×2倍！':''),'enemy');
  } else if(e.burn&&Math.random()<0.35){
    const extra=Math.round(dmg*0.5);
    P.hp-=dmg+extra;
    blog(`${e.name} の炎攻撃！ ${dmg+extra} の大ダメージ！`+(runFailed?' ×2倍！':''),'enemy');
  } else {
    P.hp-=dmg;
    blog(`${e.name} の攻撃！ ${dmg} ダメージ！`+(runFailed?' ×2倍！':''),'enemy');
  }

  if(G.enemy.poisoned){
    const pd=Math.max(1,Math.round(e.maxHp*0.25));
    e.hp-=pd;blog(`☠ ${e.name} 毒ダメージ ${pd}！`,'good');
    updateEnemyUI();
    if(e.hp<=0){P.hp=Math.max(0,P.hp);updatePlayerHud();setTimeout(checkResult,400);return;}
  }

  if(P.poisoned&&P.poisonTurns>0){
    const pd=Math.max(1,Math.round(P.maxHp*0.25));
    P.hp-=pd;P.poisonTurns--;
    blog(`☠ 毒ダメージ ${pd}！`,'bad');
    if(P.poisonTurns<=0)P.poisoned=false;
  }

  P.hp=Math.max(0,P.hp);
  updatePlayerHud();
  if(P.hp<=0){blog('戦闘不能…','bad');G.battleActive=false;setTimeout(showDeath,700);}
  else{
    if(wasDefending)G.counterBoost=true;
    setActions(true);
  }
}

// ============================================================
//  CHECK RESULT
// ============================================================
function checkResult(){
  const e=G.enemy;
  if(e.hp<=0){
    e.hp=0;updateEnemyUI();
    blog(`${e.name} を倒した！`,'good');
    G.floorKills++;G.record.kills++;
    setTimeout(()=>giveRewards(e),600);
  } else {
    enemyTurn();
  }
}

function giveRewards(e){
  G.battleActive=false;
  P.exp+=e.exp;P.gold+=e.gold;G.record.gold+=e.gold;
  let lvups=[];
  while(P.exp>=P.expNext){
    P.exp-=P.expNext;P.level++;
    P.expNext=Math.round(P.expNext*1.6);
    const inc={hp:rand(4,9),mp:rand(2,5),atk:rand(1,3),def:rand(1,2),spd:rand(1,2),int:rand(1,3)};
    P.maxHp+=inc.hp;P.maxMp+=inc.mp;
    P.hp=Math.min(P.maxHp,P.hp+Math.round(inc.hp/2));
    P.atk+=inc.atk;P.def+=inc.def;P.spd+=inc.spd;P.int+=inc.int;
    lvups.push({lv:P.level,inc});
  }
  const bossCleared=e.isBoss;
  if(bossCleared)G.record.dungeons++;
  showResult(e,lvups,bossCleared);
}

function showResult(e,lvups,bossCleared){
  document.getElementById('resultTitle').textContent=bossCleared?'勝利！':'討伐！';
  document.getElementById('resultTitle').className='result-title win';
  document.getElementById('resultSub').textContent=
    bossCleared?`${G.dungeon.name} — ${G.dungeon.floors}F ボス討伐！`:`${e.name} を倒した！`;
  document.getElementById('lvupArea').innerHTML=
    lvups.map(l=>`<div class="lvup-banner">★ レベルアップ！ Lv ${l.lv} HP+${l.inc.hp} ATK+${l.inc.atk} DEF+${l.inc.def}</div>`).join('');
  document.getElementById('rewardBox').innerHTML=`
    <div class="ritem"><span class="rl">敵</span><span class="rv">${e.name}</span></div>
    <div class="ritem"><span class="rl">経験値</span><span class="rv e">+${e.exp} EXP</span></div>
    <div class="ritem"><span class="rl">ゴールド</span><span class="rv g">+${e.gold} G</span></div>
    <div class="ritem"><span class="rl">HP</span><span class="rv h">${P.hp} / ${P.maxHp}</span></div>
    <div class="ritem"><span class="rl">${G.floor}F 進捗</span><span class="rv">${G.floorKills}/${G.floorKillsNeeded} 討伐</span></div>`;
  const btns=document.getElementById('resultBtns');
  if(bossCleared){
    btns.innerHTML=`
      <button class="rbtn pri" onclick="backToTavern()">🍺 酒場へ帰還</button>
      <button class="rbtn" onclick="openDungeonSelect()">⚔️ 別ダンジョンへ</button>`;
  } else {
    btns.innerHTML=`
      <button class="rbtn pri" onclick="nextEncounter()">▶ 次の戦闘へ</button>
      <button class="rbtn" onclick="backToTavern()">🍺 酒場へ帰還</button>`;
  }
  showScreen('result-screen');
}

function showDeath(){
  const loss=Math.max(0,Math.round(P.gold*0.1));P.gold-=loss;
  P.hp=Math.max(1,Math.round(P.maxHp*0.1));P.mp=Math.round(P.maxMp*0.2);
  P.poisoned=false;P.poisonTurns=0;
  document.getElementById('resultTitle').textContent='全滅…';
  document.getElementById('resultTitle').className='result-title lose';
  document.getElementById('resultSub').textContent='命からがら逃げ帰った…';
  document.getElementById('lvupArea').innerHTML='';
  document.getElementById('rewardBox').innerHTML=`
    <div class="ritem"><span class="rl">HP</span><span class="rv h">${P.hp} / ${P.maxHp}</span></div>
    <div class="ritem"><span class="rl">ゴールド損失</span><span class="rv" style="color:var(--hp-red)">-${loss} G</span></div>
    <div class="ritem"><span class="rl">残りゴールド</span><span class="rv g">${P.gold} G</span></div>`;
  document.getElementById('resultBtns').innerHTML=
    `<button class="rbtn pri" onclick="backToTavern()">🍺 酒場へ逃げ帰る</button>`;
  showScreen('result-screen');
}

function backToTavern(){refreshTavern();showScreen('tavern-screen');tlog('酒場に戻った。','imp');}

// ============================================================
//  ITEMS SCREEN
// ============================================================
function openItems(){
  document.getElementById('shopGold').textContent=P.gold;
  const inv=document.getElementById('inventoryList');
  if(P.inventory.length===0){
    inv.innerHTML='<div class="no-items">アイテムを持っていない</div>';
  } else {
    inv.innerHTML=P.inventory.map((item,i)=>`
      <div class="inv-row">
        <div><div class="inv-name">${item.emoji} ${item.name}</div><div class="inv-desc">${item.desc}</div></div>
        <button class="inv-use" onclick="useItemTavern(${i})">使う</button>
      </div>`).join('');
  }
  document.getElementById('shopGrid').innerHTML=SHOP_ITEMS.map(item=>`
    <div class="sitem" onclick="buyItem('${item.id}')">
      <div class="sitem-top"><span class="sitem-name">${item.emoji} ${item.name}</span><span class="sitem-price">${item.price}G</span></div>
      <div class="sitem-desc">${item.desc}</div>
    </div>`).join('');
  showScreen('items-screen');
}

function useItemTavern(i){
  const item=P.inventory[i];
  const msg=item.use(P);
  P.inventory.splice(i,1);
  tlog(`${item.name} を使用。${msg}`,'good');
  refreshTavern();openItems();
}

function buyItem(id){
  const item=SHOP_ITEMS.find(i=>i.id===id);
  if(P.gold<item.price){tlog('ゴールドが足りない！','bad');showScreen('tavern-screen');return;}
  if(P.inventory.length>=8){tlog('荷物がいっぱいだ！（最大8個）','bad');showScreen('tavern-screen');return;}
  P.gold-=item.price;P.inventory.push({...item});
  tlog(`${item.name} を ${item.price}G で購入した。`,'gold');
  openItems();
}

// ============================================================
//  SAVE / LOAD  (localStorage, 4 slots)
// ============================================================
const SAVE_KEY='dungeon_rpg_saves';
const MAX_SLOTS=4;
let slMode='save';

function getSaves(){
  try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch{return {};}
}
function setSaves(data){localStorage.setItem(SAVE_KEY,JSON.stringify(data));}

function serializePlayer(){
  return {
    name:P.name,clsId:P.cls.id,
    level:P.level,exp:P.exp,expNext:P.expNext,
    maxHp:P.maxHp,hp:P.hp,maxMp:P.maxMp,mp:P.mp,
    atk:P.atk,def:P.def,spd:P.spd,int:P.int,
    gold:P.gold,
    inventory:P.inventory.map(i=>i.id),
    record:{...G.record},
    savedAt:new Date().toLocaleString('ja-JP'),
  };
}

function deserializePlayer(d){
  const cls=CLASSES.find(c=>c.id===d.clsId);
  P={
    name:d.name,cls,
    level:d.level,exp:d.exp,expNext:d.expNext,
    maxHp:d.maxHp,hp:d.hp,maxMp:d.maxMp,mp:d.mp,
    atk:d.atk,def:d.def,spd:d.spd,int:d.int,
    gold:d.gold,
    inventory:(d.inventory||[]).map(id=>SHOP_ITEMS.find(i=>i.id===id)).filter(Boolean).map(i=>({...i})),
    poisoned:false,poisonTurns:0,
  };
  G.record=d.record||{kills:0,dungeons:0,gold:0};
}

function openSaveLoad(mode){
  slMode=mode||'save';
  switchSlTab(slMode);
  // back btn goes to create screen if no player loaded yet
  document.getElementById('slBackBtn').onclick=()=>showScreen(P?'tavern-screen':'create-screen');
  showScreen('saveload-screen');
}

function switchSlTab(mode){
  slMode=mode;
  document.getElementById('tabSave').classList.toggle('active',mode==='save');
  document.getElementById('tabLoad').classList.toggle('active',mode==='load');
  renderSlots();
}

function renderSlots(){
  const saves=getSaves();
  const list=document.getElementById('slotList');
  list.innerHTML='';
  for(let i=1;i<=MAX_SLOTS;i++){
    const s=saves[i];
    const card=document.createElement('div');
    card.className='slot-card'+(s?'':' empty');
    if(s){
      const btns=slMode==='save'
        ?`<button class="slot-btn" onclick="doSave(${i})">上書き</button>
           <button class="slot-btn danger" onclick="doDelete(${i})">削除</button>`
        :`<button class="slot-btn" onclick="doLoad(${i})">ロード</button>`;
      card.innerHTML=`
        <div class="slot-num">スロット ${i}</div>
        <div class="slot-info">
          <div class="slot-name">${s.name}</div>
          <div class="slot-detail">${CLASSES.find(c=>c.id===s.clsId)?.name||'?'} Lv${s.level} ｜ HP ${s.hp}/${s.maxHp} ｜ ${s.gold}G</div>
          <div class="slot-date">📅 ${s.savedAt}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">${btns}</div>`;
    } else {
      const btn=slMode==='save'
        ?`<button class="slot-btn" onclick="doSave(${i})">保存</button>`
        :`<button class="slot-btn disabled" disabled>空き</button>`;
      card.innerHTML=`
        <div class="slot-num">スロット ${i}</div>
        <div class="slot-info">空きスロット</div>
        ${btn}`;
    }
    list.appendChild(card);
  }
}

function doSave(slot){
  if(!P){alert('冒険者がいない！');return;}
  const saves=getSaves();
  saves[slot]=serializePlayer();
  setSaves(saves);
  renderSlots();
  tlog(`スロット ${slot} にセーブした。`,'gold');
}

function doLoad(slot){
  const saves=getSaves();
  const d=saves[slot];
  if(!d){return;}
  deserializePlayer(d);
  G.dungeon=null;G.battleActive=false;G.defending=false;G.exposed=false;
  G.poisonTurns=0;G.floorKills=0;G.isBoss=false;
  refreshTavern();
  showScreen('tavern-screen');
  tlog(`スロット ${slot} からロードした。ようこそ、${P.name}！`,'imp');
}

function doDelete(slot){
  if(!confirm(`スロット ${slot} のデータを削除しますか？`))return;
  const saves=getSaves();
  delete saves[slot];
  setSaves(saves);
  renderSlots();
}

    <tr><td>経験値</td><td>${P.exp} / ${P.expNext}</td></tr>

  document.getElementById('statusStats').innerHTML=`
    <tr><td>HP</td><td style="color:var(--hp-red)">${P.hp} / ${P.maxHp}</td></tr>
    <tr><td>MP</td><td style="color:var(--mp-blue)">${P.mp} / ${P.maxMp}</td></tr>
    <tr><td>ATK（攻撃力）</td><td>${P.atk}</td></tr>
    <tr><td>DEF（防御力）</td><td>${P.def}</td></tr>
    <tr><td>SPD（素早さ）</td><td>${P.spd}</td></tr>

  showScreen('status-screen');
