<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者派遣クロニクル</title>
<style>
  :root {
    --bg: #0d0d14;
    --bg2: #13131f;
    --bg3: #1a1a2e;
    --panel: #16162a;
    --border: rgba(140,120,255,0.15);
    --border2: rgba(140,120,255,0.35);
    --accent: #7c6fff;
    --accent2: #a594ff;
    --gold: #f0c040;
    --text: #e8e4ff;
    --text2: #9990cc;
    --text3: #665fa0;
    --great: #4fc97e;
    --good: #5bb8ff;
    --mixed: #f0c040;
    --bad: #ff6b6b;
    --radius: 10px;
    --radius-lg: 16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;min-height:100vh;line-height:1.6}
  #app{max-width:920px;margin:0 auto;padding:24px 16px}
  .header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}
  .header h1{font-size:22px;font-weight:600;letter-spacing:.05em;color:var(--accent2)}
  .header .sub{font-size:13px;color:var(--text3)}
  .two-col{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media(max-width:700px){.two-col{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
  .panel-title{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:14px}
  .sec{margin-bottom:18px}
  .sec-label{font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .name-input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
  .name-input:focus{border-color:var(--accent)}
  .name-input::placeholder{color:var(--text3)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 11px;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2);transition:all .12s;user-select:none}
  .chip:hover{border-color:var(--border2);color:var(--text)}
  .chip.sel{background:rgba(124,111,255,0.18);border-color:var(--accent);color:var(--accent2);font-weight:500}
  .stat-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .stat-name{font-size:12px;color:var(--text2);width:34px;flex-shrink:0}
  .stat-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer}
  .stat-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}
  .stat-val{font-size:12px;font-weight:600;color:var(--accent2);width:20px;text-align:right;flex-shrink:0}
  .remain-bar{text-align:center;font-size:11px;color:var(--text3);padding:5px;background:var(--bg3);border-radius:6px;margin-bottom:10px}
  .remain-bar span{color:var(--gold);font-weight:600}
  .btn-send{width:100%;padding:13px;margin-top:4px;background:linear-gradient(135deg,#6255d4,#8b7aff);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.05em;transition:opacity .15s,transform .1s}
  .btn-send:hover{opacity:.9;transform:translateY(-1px)}

  /* 世界トラブルボックス */
  .trouble-box{
    background:rgba(255,80,80,0.07);
    border:1px solid rgba(255,100,100,0.3);
    border-radius:var(--radius-lg);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .trouble-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff8080;margin-bottom:8px}
  .trouble-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:8px 6px;border-bottom:1px solid rgba(255,100,100,0.1);
    font-size:12px;color:#e8b0b0;line-height:1.6;
    cursor:pointer;border-radius:8px;transition:background .12s;
    margin:0 -6px;
  }
  .trouble-item:last-child{border-bottom:none}
  .trouble-item:hover{background:rgba(255,100,100,0.08)}
  .trouble-item.selected{
    background:rgba(124,111,255,0.15);
    border-bottom-color:transparent;
    outline:1px solid rgba(124,111,255,0.5);
  }
  .trouble-item.selected .trouble-text{color:var(--accent2);font-weight:500}
  .trouble-icon{font-size:14px;flex-shrink:0;margin-top:2px}
  .trouble-text{}
  .trouble-sel-badge{
    font-size:10px;font-weight:700;letter-spacing:.06em;
    color:var(--accent2);background:rgba(124,111,255,0.2);
    border-radius:4px;padding:1px 5px;margin-left:5px;
    vertical-align:middle;display:none;
  }
  .trouble-item.selected .trouble-sel-badge{display:inline}
  .trouble-hint{
    margin-top:6px;font-size:11px;color:rgba(255,200,100,0.8);
    background:rgba(255,200,100,0.07);
    border-radius:6px;padding:6px 10px;
    border-left:2px solid rgba(255,200,100,0.4);
  }

  /* ログ列 */
  #log-col{display:flex;flex-direction:column;gap:14px}
  .chronicle{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .chr-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .chr-info .cname{font-size:14px;font-weight:600;color:var(--text)}
  .chr-info .csub{font-size:11px;color:var(--text3);margin-top:1px}
  .outcome-badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex-shrink:0}
  .ob-great{background:rgba(79,201,126,.15);color:var(--great)}
  .ob-good{background:rgba(91,184,255,.15);color:var(--good)}
  .ob-mixed{background:rgba(240,192,64,.15);color:var(--mixed)}
  .ob-bad{background:rgba(255,107,107,.15);color:var(--bad)}
  .chr-story{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:10px}
  .chr-result{font-size:12px;color:var(--text3);margin-bottom:10px}

  /* 最終ステータス */
  .final-stats{
    background:var(--bg3);border-radius:8px;
    padding:10px 12px;
    border:1px solid var(--border);
  }
  .final-stats-title{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text3);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .final-stats-title span{color:var(--gold)}
  .final-stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .fstat{text-align:center}
  .fstat-name{font-size:10px;color:var(--text3);margin-bottom:2px}
  .fstat-val{font-size:14px;font-weight:700;color:var(--text)}
  .fstat-diff{font-size:10px;font-weight:600}
  .diff-up{color:var(--great)}
  .diff-dn{color:var(--bad)}
  .diff-no{color:var(--text3)}
  .lv-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(240,192,64,0.12);
    border:1px solid rgba(240,192,64,0.3);
    border-radius:6px;padding:3px 8px;
    font-size:12px;font-weight:700;color:var(--gold);
    margin-bottom:8px;
  }

  .empty-log{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius-lg);line-height:2}
  /* 8段階バッジ */
  .ob-great2{background:rgba(79,201,126,.2);color:#4fc97e;border:1px solid rgba(79,201,126,.3)}
  .ob-great1{background:rgba(136,224,168,.15);color:#88e0a8;border:1px solid rgba(136,224,168,.25)}
  .ob-honor{background:rgba(255,215,0,.15);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
  .ob-mixed{background:rgba(240,192,64,.15);color:#f0c040;border:1px solid rgba(240,192,64,.25)}
  .ob-flee{background:rgba(255,153,102,.15);color:#ff9966;border:1px solid rgba(255,153,102,.25)}
  .ob-captured{background:rgba(255,119,119,.15);color:#ff7777;border:1px solid rgba(255,119,119,.25)}
  .ob-missing{background:rgba(204,102,204,.15);color:#cc66cc;border:1px solid rgba(204,102,204,.25)}
  .ob-dead{background:rgba(255,68,68,.2);color:#ff4444;border:1px solid rgba(255,68,68,.35)}
  /* 知名度バー */
  .fame-bar-wrap{
    background:var(--bg3);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px 14px;
    margin-bottom:14px;
  }
  .fame-bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .fame-bar-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
  .fame-bar-val{font-size:14px;font-weight:700}
  .fame-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
  .fame-fill{height:100%;border-radius:4px;transition:width .4s ease,background .4s}
  /* 設定画面 */
  .settings-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
    align-items:center;justify-content:center;
  }
  .settings-overlay.open{display:flex}
  .settings-panel{
    background:var(--panel);border:1px solid var(--border2);
    border-radius:var(--radius-lg);padding:24px;
    width:min(560px,95vw);max-height:85vh;overflow-y:auto;
  }
  .settings-panel h2{font-size:16px;font-weight:600;color:var(--accent2);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
  .settings-close{cursor:pointer;color:var(--text3);font-size:20px;line-height:1}
  .settings-section{margin-bottom:20px}
  .settings-section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .settings-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .settings-row label{font-size:12px;color:var(--text2);flex:1;min-width:0}
  .settings-input{
    width:70px;padding:4px 8px;background:var(--bg3);
    border:1px solid var(--border);border-radius:6px;
    color:var(--text);font-size:12px;text-align:right;outline:none;
  }
  .settings-input:focus{border-color:var(--accent)}
  .btn-settings{
    padding:5px 12px;background:var(--bg3);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text2);font-size:12px;cursor:pointer;
    transition:border-color .15s;
  }
  .btn-settings:hover{border-color:var(--border2);color:var(--text)}
  .btn-reset-settings{
    width:100%;padding:8px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);
    border-radius:var(--radius);color:#ff7777;font-size:12px;cursor:pointer;margin-top:8px;
  }
  .breakdown-box{
    margin-top:10px;background:rgba(0,0,0,0.3);
    border:1px solid rgba(124,111,255,0.15);
    border-radius:8px;padding:10px 12px;font-size:11px;
  }
  .breakdown-title{color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
  .breakdown-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .bd-tag{padding:2px 7px;border-radius:4px;background:rgba(124,111,255,0.1);color:var(--text3)}
  .bd-match{background:rgba(79,201,126,0.12);color:#6ed89a}
  .bd-score{font-size:13px;font-weight:700;color:var(--accent2);margin-top:4px}
  .bd-tier{font-size:11px;color:var(--text3)}
  .total-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);padding-bottom:4px}
  .total-bar b{color:var(--text2)}
  .outcome-dots{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .od{width:8px;height:8px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>⚔ 勇者派遣クロニクル</h1>
    <span class="sub">世界のトラブルに立ち向かう勇者を送り出せ</span>
    <button class="btn-settings" onclick="openSettings()" style="margin-left:auto">⚙ 設定</button>
  </div>
  <!-- 知名度バー -->
  <div class="fame-bar-wrap" id="fame-bar-wrap">
    <div class="fame-bar-label">
      <span class="fame-bar-title">⭐ 派遣所の知名度</span>
      <span class="fame-bar-val" id="fame-val">0</span>
    </div>
    <div class="fame-track"><div class="fame-fill" id="fame-fill" style="width:50%;background:#7c6fff"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px"><span>-100</span><span>0</span><span>∞</span></div>
  </div>

  <div class="two-col">
    <!-- 左：作成パネル -->
    <div>
      <div class="panel">
        <div class="panel-title">キャラクター作成</div>
        <div class="sec">
          <div class="sec-label">名前</div>
          <div style="display:flex;gap:6px">
            <input class="name-input" id="name-input" type="text" placeholder="名前を入力…" maxlength="14" style="flex:1">
            <button onclick="randomName()" title="ランダム名前" style="padding:0 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:15px;cursor:pointer;transition:border-color .15s;flex-shrink:0" onmouseover="this.style.borderColor='var(--border2)'" onmouseout="this.style.borderColor='var(--border)'">🎲</button>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">性別</div>
          <div class="chips">
            <div class="chip sel" data-g="gender" data-v="男">男性</div>
            <div class="chip" data-g="gender" data-v="女">女性</div>
            <div class="chip" data-g="gender" data-v="謎">不明</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">種族</div>
          <div class="chips">
            <div class="chip sel" data-g="race" data-v="人間">🧑 人間</div>
            <div class="chip" data-g="race" data-v="エルフ">🧝 エルフ</div>
            <div class="chip" data-g="race" data-v="ドワーフ">⛏ ドワーフ</div>
            <div class="chip" data-g="race" data-v="獣人">🐾 獣人</div>
            <div class="chip" data-g="race" data-v="魔族">😈 魔族</div>
            <div class="chip" data-g="race" data-v="竜人">🐉 竜人</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">職業</div>
          <div class="chips">
            <div class="chip sel" data-g="job" data-v="戦士">⚔ 戦士</div>
            <div class="chip" data-g="job" data-v="魔法使い">🔮 魔法使い</div>
            <div class="chip" data-g="job" data-v="盗賊">🗡 盗賊</div>
            <div class="chip" data-g="job" data-v="聖職者">✨ 聖職者</div>
            <div class="chip" data-g="job" data-v="弓使い">🏹 弓使い</div>
            <div class="chip" data-g="job" data-v="錬金術師">⚗ 錬金術師</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">性格</div>
          <div class="chips">
            <div class="chip sel" data-g="personality" data-v="勇敢">勇敢</div>
            <div class="chip" data-g="personality" data-v="慎重">慎重</div>
            <div class="chip" data-g="personality" data-v="好奇心旺盛">好奇心旺盛</div>
            <div class="chip" data-g="personality" data-v="義侠心">義侠心</div>
            <div class="chip" data-g="personality" data-v="強欲">強欲</div>
            <div class="chip" data-g="personality" data-v="孤高">孤高</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">パラメーター配分</div>
          <div class="remain-bar">残りポイント: <span id="remain">36</span> / 36</div>
          <div id="stat-sliders"></div>
        </div>
        <button class="btn-send" id="send-btn" onclick="sendHero()"><span id="send-label">▶ 冒険へ旅立たせる</span></button>
      </div>
    </div>

    <!-- 右：ログ -->
    <div id="log-col">
      <div class="empty-log" id="log-empty">
        まだ誰も旅立っていません<br>
        <span style="font-size:11px">キャラクターを作って旅立たせると<br>ここに冒険の記録が積み重なります</span>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  定数
// ═══════════════════════════════════════════
const STATS = ['腕力','体力','魔力','素早','知恵','運'];
const TOTAL = 36;
const RACE_EMOJI = {人間:'🧑',エルフ:'🧝',ドワーフ:'⛏',獣人:'🐾',魔族:'😈',竜人:'🐉'};
const JOB_EMOJI  = {戦士:'⚔',魔法使い:'🔮',盗賊:'🗡',聖職者:'✨',弓使い:'🏹',錬金術師:'⚗'};
const OL = {
  great2:'大成功', great1:'成功', honor:'名誉の戦死',
  mixed:'波乱',
  flee:'逃げ帰る', captured:'捕虜', missing:'行方不明', dead:'死亡'
};
const OC = {
  great2:'ob-great2', great1:'ob-great1', honor:'ob-honor',
  mixed:'ob-mixed',
  flee:'ob-flee', captured:'ob-captured', missing:'ob-missing', dead:'ob-dead'
};
const ODOT = {
  great2:'#4fc97e', great1:'#88e0a8', honor:'#ffd700',
  mixed:'#f0c040',
  flee:'#ff9966', captured:'#ff7777', missing:'#cc66cc', dead:'#ff4444'
};
// クリア系かどうか
const IS_CLEAR = {great2:true,great1:true,honor:true,mixed:true,flee:false,captured:false,missing:false,dead:false};
// 知名度変動量
const FAME_DELTA = {great2:30,great1:15,honor:10,mixed:5,flee:-10,captured:-15,missing:-20,dead:-25};

// ═══════════════════════════════════════════
//  世界トラブルデータ
//  各トラブルに「対抗に有効なキャラ像」のヒントを持たせる
// ═══════════════════════════════════════════
// ═══════════════════════════════════════════
//  トラブル自動生成エンジン（無限生成）
// ═══════════════════════════════════════════
const T_PLACES = [
  {name:'王都の城下町',   area:'城下町'},
  {name:'東部の港町アルミア', area:'港町'},
  {name:'北方の山岳要塞', area:'山岳'},
  {name:'西部の禁断の森', area:'森'},
  {name:'古代遺跡の地下', area:'遺跡'},
  {name:'砂漠の交易都市', area:'砂漠'},
  {name:'浮遊島の神殿',   area:'空中'},
  {name:'深海の神殿',     area:'海底'},
  {name:'雪原の修道院',   area:'雪原'},
  {name:'魔族の支配領域', area:'魔界'},
  {name:'辺境の開拓村',   area:'辺境'},
  {name:'竜の巣がある峡谷', area:'峡谷'},
  {name:'地下迷宮の最深部', area:'地下'},
  {name:'湖畔の精霊郷',  area:'湖畔'},
  {name:'廃墟となった王国', area:'廃墟'},
];

const T_THREATS = [
  {
    name:'魔王軍の将軍「{N}」', icon:'🔥',
    names:['暗黒卿ザルガス','炎将バルドス','鋼鉄卿グロム','影将ヴェイン','死神卿アバドン'],
    desc:'が千年の封印を破り復活した。軍勢が{PLACE}に迫り、村々を次々と灰燼に帰している。',
    need:'正面突破できる強力な戦士が必要だ。',
    favorJob:['戦士'], favorRace:['竜人','ドワーフ'], favorStat:'腕力',
    hints:[

function generateTrouble(){
  const place  = T_PLACES[Math.floor(Math.random()*T_PLACES.length)];
  const threat = T_THREATS[Math.floor(Math.random()*T_THREATS.length)];
  const placeName = (T_PLACE_NAMES[place.area]||[place.name])[Math.floor(Math.random()*(T_PLACE_NAMES[place.area]||[place.name]).length)];
  const threatName = threat.names ? threat.names[Math.floor(Math.random()*threat.names.length)] : '';

  const nameStr = threat.name.replace('{N}', threatName);
  const descStr = threat.desc.replace('{PLACE}', placeName);
  const text    = nameStr + descStr + threat.need;

  // ヒントをディープコピー
  return {
    icon:       threat.icon,
    text:       text,
    hints:      [...threat.hints],
    hintCount:  0,
    favorJob:   threat.favorJob,
    favorRace:  threat.favorRace,
    favorStat:  threat.favorStat,
  };
}

//  最終ステータス計算
//  outcome・パラメーター・種族ボーナスで成長量が変わる
// ═══════════════════════════════════════════
const OUTCOME_GROW = {great2:1.2, great1:0.8, honor:0.6, mixed:0.3, flee:-0.05, captured:-0.1, missing:-0.05, dead:-0.15};
// 種族の成長傾向（得意ステータスに追加補正）
const RACE_GROW_BIAS = {
  人間:    {腕力:1,体力:1,魔力:1,素早:1,知恵:1,運:1},
  エルフ:  {腕力:0,体力:0,魔力:2,素早:1,知恵:2,運:1},
  ドワーフ:{腕力:3,体力:2,魔力:0,素早:0,知恵:1,運:0},
  獣人:    {腕力:2,体力:1,魔力:0,素早:2,知恵:0,運:1},
  魔族:    {腕力:0,体力:0,魔力:3,素早:1,知恵:1,運:0},
  竜人:    {腕力:2,体力:2,魔力:1,素早:1,知恵:1,運:1},
};
// 職業の成長傾向
const JOB_GROW_BIAS = {
  戦士:    {腕力:3,体力:2,魔力:0,素早:1,知恵:0,運:0},
  魔法使い:{腕力:0,体力:0,魔力:3,素早:0,知恵:2,運:0},
  盗賊:    {腕力:1,体力:1,魔力:0,素早:3,知恵:0,運:1},
  聖職者:  {腕力:0,体力:0,魔力:1,素早:0,知恵:3,運:1},
  弓使い:  {腕力:1,体力:1,魔力:0,素早:2,知恵:1,運:1},
  錬金術師:{腕力:0,体力:0,魔力:1,素早:0,知恵:3,運:1},
};

function calcFinalStats(initSv, outcome, race, job, lv){
  const growRate = OUTCOME_GROW[outcome] ?? 0;
  const raceBias = RACE_GROW_BIAS[race] || {};
  const jobBias  = JOB_GROW_BIAS[job]  || {};
  const final = {};
  STATS.forEach(s=>{
    const base = initSv[s];
    const bias = (raceBias[s]||0) + (jobBias[s]||0); // 0~6
    // 成長量 = lv * (growRate * (0.4 + bias*0.08) )  四捨五入
    const growth = Math.round(lv * growRate * (0.4 + bias * 0.08));
    final[s] = Math.max(0, base + growth);
  });
  return final;
}

function calcLevel(outcome, initSv){
  const baseScore = Object.values(initSv).reduce((a,b)=>a+b,0);
  const growRate = Math.max(0, OUTCOME_GROW[outcome] ?? 0);
  const lv = Math.max(1, Math.round((baseScore / 3) * (0.5 + growRate * 1.2)));
  return lv;
}

// ═══════════════════════════════════════════
function rng(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// 種族・職業・性格・性別ごとのステータス補正定義
const RACE_BONUS = {
  人間:    {体力:1, 素早:1, 運:1},
  エルフ:  {魔力:3, 知恵:2},
  ドワーフ:{腕力:3, 体力:2},
  獣人:    {腕力:2, 素早:3},
  魔族:    {魔力:4, 知恵:1},
  竜人:    {腕力:2, 体力:2, 魔力:1},
};
const JOB_BONUS = {
  戦士:    {腕力:3, 体力:2},
  魔法使い:{魔力:3, 知恵:2},
  盗賊:    {素早:3, 運:2},
  聖職者:  {知恵:3, 魔力:1},
  弓使い:  {素早:2, 知恵:1, 運:1},
  錬金術師:{知恵:3, 魔力:1},
};
const PERSONALITY_BONUS = {
  勇敢:      {腕力:2, 体力:1},
  慎重:      {知恵:2, 運:1},
  好奇心旺盛:{知恵:1, 魔力:1},
  義侠心:    {体力:1, 運:2},
  強欲:      {運:2, 素早:1},
  孤高:      {腕力:1, 魔力:1},
};
const GENDER_BONUS = {
  男: {腕力:2},
  女: {運:2},
  謎: {腕力:1, 運:1},
};

function applyBonus(svAdj, bonusMap){
  if(!bonusMap) return;
  Object.entries(bonusMap).forEach(([s,v])=>{ svAdj[s] = (svAdj[s]||0) + v; });
}

function calcOutcomeWeights(sv, race, job, personality, gender, heroCount, currentTrouble){
  // 全補正をsvAdjに乗せる（表示値には影響しない、計算専用）
  const svAdj = {...sv};
  applyBonus(svAdj, RACE_BONUS[race]);
  applyBonus(svAdj, JOB_BONUS[job]);
  applyBonus(svAdj, PERSONALITY_BONUS[personality]);
  applyBonus(svAdj, GENDER_BONUS[gender]);

  // トラブルの要求ステータスを3.5倍重みで評価
  const STAT_BASE_W = {腕力:1.0, 体力:1.0, 魔力:1.0, 素早:1.0, 知恵:1.0, 運:1.0};
  const statW = {...STAT_BASE_W};
  if(currentTrouble && currentTrouble.favorStat){
    statW[currentTrouble.favorStat] = 3.5;
  }
  const rawPower = Object.keys(statW).reduce((a,s)=> a + (svAdj[s]||0) * statW[s], 0);
  const maxRaw = 50 * 3.5; // 補正後の最大値に合わせて調整
  const power = Math.min(rawPower / maxRaw * 100, 100);

  // 適性ボーナス（CFGの設定値を参照）
  let matchBonus = 0;
  if(currentTrouble){
    if(currentTrouble.favorJob.includes(job))   matchBonus += CFG.jobBonus;
    if(currentTrouble.favorRace.includes(race)) matchBonus += CFG.raceBonus;
    const fv = (svAdj[currentTrouble.favorStat]||0);
    if(fv >= 16)      matchBonus += CFG.statHi;
    else if(fv >= 12) matchBonus += CFG.statMd;
    else if(fv >= 8)  matchBonus += CFG.statLo;
  }

  const score = power + matchBonus;

  // [大成功, 成功, 名誉の戦死, 波乱, 逃げ帰る, 捕虜, 行方不明, 死亡]
  if(score >= CFG.t1) return [35, 35, 10, 12,  4,  2,  1,  1];
  if(score >= CFG.t2) return [15, 30, 10, 20, 12,  6,  4,  3];
  if(score >= CFG.t3) return [ 5, 18,  7, 22, 20, 12,  9,  7];
  if(score >= CFG.t4) return [ 2,  8,  4, 18, 25, 18, 13, 12];
  if(score >= CFG.t5) return [ 1,  3,  2, 12, 25, 20, 18, 19];
  return                      [ 0,  1,  1,  8, 20, 22, 22, 26];
}

// 計算内訳を返す関数（表示用）
function calcScoreBreakdown(sv, race, job, personality, gender, currentTrouble){
  const svAdj = {...sv};
  const raceB = RACE_BONUS[race]||{};
  const jobB  = JOB_BONUS[job]||{};
  const perB  = PERSONALITY_BONUS[personality]||{};
  const genB  = GENDER_BONUS[gender]||{};
  applyBonus(svAdj, raceB);
  applyBonus(svAdj, jobB);
  applyBonus(svAdj, perB);
  applyBonus(svAdj, genB);

  const statW = {腕力:1.0,体力:1.0,魔力:1.0,素早:1.0,知恵:1.0,運:1.0};
  if(currentTrouble && currentTrouble.favorStat) statW[currentTrouble.favorStat] = 3.5;

  const rawPower = Object.keys(statW).reduce((a,s)=> a + (svAdj[s]||0) * statW[s], 0);
  const power = Math.min(rawPower / (50*3.5) * 100, 100);

  let matchBonus = 0, matchDetails = [];
  if(currentTrouble){
    if(currentTrouble.favorJob.includes(job)){   matchBonus+=CFG.jobBonus;  matchDetails.push('職業適性+'+CFG.jobBonus); }
    if(currentTrouble.favorRace.includes(race)){ matchBonus+=CFG.raceBonus; matchDetails.push('種族適性+'+CFG.raceBonus); }
    const fv = svAdj[currentTrouble.favorStat]||0;
    if(fv>=16){      matchBonus+=CFG.statHi; matchDetails.push(currentTrouble.favorStat+'特化+'+CFG.statHi); }
    else if(fv>=12){ matchBonus+=CFG.statMd; matchDetails.push(currentTrouble.favorStat+'高め+'+CFG.statMd); }
    else if(fv>=8){  matchBonus+=CFG.statLo; matchDetails.push(currentTrouble.favorStat+'普通+'+CFG.statLo); }
  }
  const score = power + matchBonus;

  // svAdjの補正内訳
  const bonusLines = [];
  Object.entries(raceB).forEach(([s,v])=> bonusLines.push(`${race}→${s}+${v}`));
  Object.entries(jobB) .forEach(([s,v])=> bonusLines.push(`${job}→${s}+${v}`));
  Object.entries(perB) .forEach(([s,v])=> bonusLines.push(`${personality}→${s}+${v}`));
  Object.entries(genB) .forEach(([s,v])=> bonusLines.push(`${gender==='男'?'男性':gender==='女'?'女性':'不明'}→${s}+${v}`));

  return { svAdj, power:power.toFixed(1), matchBonus, matchDetails, score:score.toFixed(1), bonusLines, favorStat: currentTrouble?.favorStat };
}

function weightedPick(arr, weights){
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<arr.length;i++){ r-=weights[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}

// ═══════════════════════════════════════════
//  物語生成
// ═══════════════════════════════════════════
function generateStory(name, gender, race, job, personality, sv, heroCount, prevImpacts, currentTrouble){
  const outcomes  = ['great2','great1','honor','mixed','flee','captured','missing','dead'];
  const weights   = calcOutcomeWeights(sv, race, job, personality, gender, heroCount, currentTrouble);
  const outcome   = weightedPick(outcomes, weights);
  const breakdown = calcScoreBreakdown(sv, race, job, personality, gender, currentTrouble);

  const stage    = rng(STAGES);
  const enemy    = rng(ENEMIES[stage.tag]);
  const jobStyle = rng(JOB_STYLE[job]  || ['戦い']);
  const raceFlav = rng(RACE_FLAVOR[race]|| ['']);
  const perAct   = rng(PERSONALITY_ACT[personality]|| ['進み']);
  const midEp    = rng(MID_EPISODES);
  const endData  = rng(ENDINGS[outcome]);

  let worldLine = '';
  if(prevImpacts.length>0){
    worldLine = `かつての勇者が「${prevImpacts[prevImpacts.length-1]}」という爪痕を残したこの地で、`;
  }
  const pronoun = gender==='女'?'彼女':(gender==='男'?'彼':'その者');

  const story =
    `${worldLine}${name}は${stage.name}へと旅立った。${raceFlav}、${perAct}${pronoun}は険しき道を歩んだ。`+
    `${midEp}`+
    `ついに${enemy}と対峙した${name}は、${jobStyle}${raceFlav}戦いに臨んだ。`+
    `激闘の末、${name}は${enemy}${endData.r}。`;

  // LV・最終ステータス
  const lv = calcLevel(outcome, sv);
  const finalStats = calcFinalStats(sv, outcome, race, job, lv);

  return { story, result:`${enemy}${endData.r}`, outcome, worldImpact:endData.w, stage:stage.name, enemy, lv, finalStats, breakdown };
}

function randomStats(){
  const weights = JOB_STAT_WEIGHT[sel.job] || {腕力:1,体力:1,魔力:1,素早:1,知恵:1,運:1};
  const stats = ['腕力','体力','魔力','素早','知恵','運'];
  // 重みにランダムブレを加えて毎回変化
  const w = stats.map(s => weights[s] * (0.5 + Math.random() * 1.0));
  const wTotal = w.reduce((a,b)=>a+b, 0);
  // TOTAL=36を重みで按分（最低1、最大18）
  let pts = stats.map((s,i) => Math.max(1, Math.min(18, Math.round(TOTAL * w[i] / wTotal))));
  // 合計をTOTALに調整
  let diff = TOTAL - pts.reduce((a,b)=>a+b, 0);
  let guard = 100;
  while(diff !== 0 && guard-- > 0){
    const idx = Math.floor(Math.random() * stats.length);
    if(diff > 0 && pts[idx] < 18){ pts[idx]++; diff--; }
    else if(diff < 0 && pts[idx] > 1){ pts[idx]--; diff++; }
  }
  // sv に反映してスライダーUIも更新
  stats.forEach((s,i) => {
    sv[s] = pts[i];
    const input = document.getElementById('sl-'+s);
    const valEl = document.getElementById('sv-'+s);
    if(input) input.value = pts[i];
    if(valEl) valEl.textContent = pts[i];
  });
  updateRemain();
}

    targetTrouble: targetTrouble ? targetTrouble.text : null,
    breakdown: result.breakdown,
  };
  heroes.unshift(hero);
  pastImpacts.unshift(result.worldImpact);
  if(pastImpacts.length>8) pastImpacts.pop();

  // 知名度更新
  const delta = FAME_DELTA[result.outcome] || 0;
  fame = Math.max(-100, fame + delta);
  updateFameBar();

  // トラブル更新
  const resolved = IS_CLEAR[result.outcome];
  const t = activetroubles_displayed[selectedTroubleIdx];
  if(result.outcome === 'great2' || result.outcome === 'great1'){
    // 完全クリア: トラブル解決
    activetroubles_displayed.splice(selectedTroubleIdx, 1);
    activetroubles_displayed.push(pickNextTrouble());
  } else if(result.outcome === 'honor' || result.outcome === 'mixed'){
    // 名誉の戦死・波乱: ヒント解放、トラブルは一応解決扱い
    activetroubles_displayed.splice(selectedTroubleIdx, 1);
    activetroubles_displayed.push(pickNextTrouble());
  } else {
    // 未達成系: ヒント解放・悪化・新トラブル追加
    if(t){
      if(t.hintCount < (t.hints||[]).length) t.hintCount++;
      if(!t.worsened){ t.text = '【悪化】' + t.text; t.worsened = true; }
    }
    activetroubles_displayed.push(pickNextTrouble());
    if(activetroubles_displayed.length > 5) activetroubles_displayed = activetroubles_displayed.slice(0,5);
  }
  // 最低3件は維持
  while(activetroubles_displayed.length < 3) activetroubles_displayed.push(pickNextTrouble());
  // 選択をリセット
  selectedTroubleIdx = 0;

  renderLog();
  updateSendLabel();
}

//  描画
// ═══════════════════════════════════════════
function renderLog(){
  const col=document.getElementById('log-col');
  col.innerHTML='';

  // 世界トラブルボックス（ヒーローがいなくても常に表示）
  const tb = document.createElement('div');
  tb.className='trouble-box';
  tb.innerHTML=`<div class="trouble-title">⚠ 世界で起きているトラブル — クリックして挑む件を選択</div>`+
    activetroubles_displayed.map((t,i)=>{
      const hintsHtml = (t.hints||[]).slice(0, t.hintCount||0).map((h,hi)=>
        `<div class="trouble-hint">💡 ${h}</div>`
      ).join('');
      return `
      <div class="trouble-item${i===selectedTroubleIdx?' selected':''}" onclick="selectTrouble(${i})">
        <span class="trouble-icon">${t.icon}</span>
        <div style="flex:1">
          <div class="trouble-text">${t.text}<span class="trouble-sel-badge">← 選択中</span></div>
          ${hintsHtml}
        </div>
      </div>`;
    }).join('');
  col.appendChild(tb);

  if(!heroes.length){
    const empty=document.createElement('div');
    empty.className='empty-log';
    empty.innerHTML='まだ誰も旅立っていません<br><span style="font-size:11px">上のトラブルを参考にキャラを作って旅立たせよう</span>';
    col.appendChild(empty);
    return;
  }

  // 集計バー
  const OUTCOMES8 = ['great2','great1','honor','mixed','flee','captured','missing','dead'];
  const gc={};
  OUTCOMES8.forEach(k=>gc[k]=0);
  heroes.forEach(h=>gc[h.outcome]=(gc[h.outcome]||0)+1);
  const totalBar=document.createElement('div');
  totalBar.className='total-bar';
  totalBar.innerHTML='<b>'+heroes.length+'</b> 人が旅立った'
    +'<div class="outcome-dots">'
    +OUTCOMES8.map(k=>Array(Math.min(gc[k]||0,6)).fill('<div class="od" style="background:'+ODOT[k]+'" title="'+OL[k]+':'+(gc[k]||0)+'人"></div>').join('')).join('')
    +'</div>';
  col.appendChild(totalBar);

  // クロニクル
  heroes.forEach(h=>{
    // 最終ステータスの差分
    const diffHtml = STATS.map(s=>{
      const ini = h.initStats[s];
      const fin = h.finalStats[s];
      const d = fin - ini;
      const cls = d>0?'diff-up':d<0?'diff-dn':'diff-no';
      const sign = d>0?'+':d<0?'':' ';
      return `<div class="fstat">
        <div class="fstat-name">${s}</div>
        <div class="fstat-val">${fin}</div>
        <div class="fstat-diff ${cls}">${sign}${d}</div>
      </div>`;
    }).join('');

    // 計算内訳HTML
    let breakdownHtml = '';
    if(h.breakdown){
      const b = h.breakdown;
      const tierLabel = b.score>=100?'大成功/成功帯':b.score>=80?'成功/波乱帯':b.score>=65?'波乱/失敗帯':b.score>=45?'失敗帯':'ほぼ失敗帯';
      const adjStr = Object.entries(b.svAdj).map(([s,v])=>s+':'+v).join(' ');
      const bonusTags = b.bonusLines.map(l=>'<span class="bd-tag">'+l+'</span>').join('');
      const matchTags = b.matchDetails.length
        ? b.matchDetails.map(l=>'<span class="bd-tag bd-match">'+l+'</span>').join('')
        : '<span class="bd-tag">適性ボーナスなし</span>';
      const favorLine = b.favorStat
        ? '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">要求ステータス: '+b.favorStat+'（×3.5重み）</div>'
        : '';
      breakdownHtml =
        '<div class="breakdown-box">' +
        '<div class="breakdown-title">📊 計算内訳</div>' +
        '<div class="breakdown-row">'+bonusTags+'</div>' +
        '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">補正後: '+adjStr+'</div>' +
        favorLine +
        '<div class="breakdown-row">'+matchTags+'</div>' +
        '<div class="bd-score">スコア: '+b.score+' <span class="bd-tier">（パワー'+b.power+' + 適性'+b.matchBonus+' → '+tierLabel+'）</span></div>' +
        '</div>';
    }

    const el=document.createElement('div');
    el.className='chronicle';
    el.innerHTML=
      '<div class="chr-head">' +
        '<div class="avatar">'+(RACE_EMOJI[h.race]||'👤')+'</div>' +
        '<div class="chr-info">' +
          '<div class="cname">'+h.name+' '+(JOB_EMOJI[h.job]||'')+'</div>' +
          '<div class="csub">'+(h.gender==='男'?'男性':h.gender==='女'?'女性':'不明')+' / '+h.race+' / '+h.job+' / '+h.personality+'</div>' +
        '</div>' +
        '<span class="outcome-badge '+(OC[h.outcome]||'ob-mixed')+'">'+(OL[h.outcome]||h.outcome)+'</span>' +
      '</div>' +
      '<div class="chr-story">'+h.story+'</div>' +
      '<div class="chr-result">📜 '+h.result+'</div>' +
      '<div class="final-stats">' +
        '<div class="final-stats-title">冒険後ステータス <span class="lv-badge">⭐ LV '+h.lv+'</span></div>' +
        '<div class="final-stats-grid">'+diffHtml+'</div>' +
      '</div>' +
      breakdownHtml;
    col.appendChild(el);
  });
}

// ── 設定値（calcOutcomeWeightsから参照） ──
let CFG = {
  t1:115, t2:100, t3:80, t4:60, t5:40,
  jobBonus:15, raceBonus:10, statHi:12, statMd:7, statLo:3,
  fGreat2:30, fGreat1:15, fHonor:10, fMixed:5,
  fFlee:-10, fCaptured:-15, fMissing:-20, fDead:-25,
};

function openSettings(){
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.remove('open');
}
function closeSettingsOutside(e){
  if(e.target===document.getElementById('settings-overlay')) closeSettings();
}
function applySettings(){
  CFG.t1 = +document.getElementById('cfg-t1').value;
  CFG.t2 = +document.getElementById('cfg-t2').value;
  CFG.t3 = +document.getElementById('cfg-t3').value;
  CFG.t4 = +document.getElementById('cfg-t4').value;
  CFG.t5 = +document.getElementById('cfg-t5').value;
  CFG.jobBonus  = +document.getElementById('cfg-job-bonus').value;
  CFG.raceBonus = +document.getElementById('cfg-race-bonus').value;
  CFG.statHi    = +document.getElementById('cfg-stat-hi').value;
  CFG.statMd    = +document.getElementById('cfg-stat-md').value;
  CFG.statLo    = +document.getElementById('cfg-stat-lo').value;
  CFG.fGreat2   = +document.getElementById('cfg-f-great2').value;
  CFG.fGreat1   = +document.getElementById('cfg-f-great1').value;
  CFG.fHonor    = +document.getElementById('cfg-f-honor').value;
  CFG.fMixed    = +document.getElementById('cfg-f-mixed').value;
  CFG.fFlee     = +document.getElementById('cfg-f-flee').value;
  CFG.fCaptured = +document.getElementById('cfg-f-captured').value;
  CFG.fMissing  = +document.getElementById('cfg-f-missing').value;
  CFG.fDead     = +document.getElementById('cfg-f-dead').value;
  // FAME_DELTAも更新
  FAME_DELTA.great2=CFG.fGreat2; FAME_DELTA.great1=CFG.fGreat1; FAME_DELTA.honor=CFG.fHonor;
  FAME_DELTA.mixed=CFG.fMixed; FAME_DELTA.flee=CFG.fFlee; FAME_DELTA.captured=CFG.fCaptured;
  FAME_DELTA.missing=CFG.fMissing; FAME_DELTA.dead=CFG.fDead;

}
function resetSettings(){
  CFG = {t1:115,t2:100,t3:80,t4:60,t5:40,jobBonus:15,raceBonus:10,statHi:12,statMd:7,statLo:3,fGreat2:30,fGreat1:15,fHonor:10,fMixed:5,fFlee:-10,fCaptured:-15,fMissing:-20,fDead:-25};

  document.getElementById('cfg-t2').value=CFG.t2;

  document.getElementById('cfg-t5').value=CFG.t5;
  document.getElementById('cfg-job-bonus').value=CFG.jobBonus;
  document.getElementById('cfg-race-bonus').value=CFG.raceBonus;
  document.getElementById('cfg-stat-hi').value=CFG.statHi;
  document.getElementById('cfg-stat-md').value=CFG.statMd;

  document.getElementById('cfg-f-great1').value=CFG.fGreat1;

  document.getElementById('cfg-f-mixed').value=CFG.fMixed;
  document.getElementById('cfg-f-flee').value=CFG.fFlee;
  document.getElementById('cfg-f-captured').value=CFG.fCaptured;

  FAME_DELTA.flee=-10;FAME_DELTA.captured=-15;FAME_DELTA.missing=-20;FAME_DELTA.dead=-25;
}

function showSettingsMsg(msg, color){
  const el = document.getElementById('settings-msg');
  if(!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--text3)';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.textContent=''; }, 2500);
}

function saveSettings(){
  // 現在の入力値を読んでJSONとしてダウンロード
  const data = {
    t1:+document.getElementById('cfg-t1').value,
    t2:+document.getElementById('cfg-t2').value,
    t3:+document.getElementById('cfg-t3').value,
    t4:+document.getElementById('cfg-t4').value,
    t5:+document.getElementById('cfg-t5').value,
    jobBonus: +document.getElementById('cfg-job-bonus').value,
    raceBonus:+document.getElementById('cfg-race-bonus').value,
    statHi:   +document.getElementById('cfg-stat-hi').value,
    statMd:   +document.getElementById('cfg-stat-md').value,
    statLo:   +document.getElementById('cfg-stat-lo').value,
    fGreat2:  +document.getElementById('cfg-f-great2').value,
    fGreat1:  +document.getElementById('cfg-f-great1').value,
    fHonor:   +document.getElementById('cfg-f-honor').value,
    fMixed:   +document.getElementById('cfg-f-mixed').value,
    fFlee:    +document.getElementById('cfg-f-flee').value,
    fCaptured:+document.getElementById('cfg-f-captured').value,
    fMissing: +document.getElementById('cfg-f-missing').value,
    fDead:    +document.getElementById('cfg-f-dead').value,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'HeroDispatch_settings.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showSettingsMsg('💾 保存しました', '#4fc97e');
}

function loadSettings(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file){ return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        // 入力欄に反映
        const map = {
          't1':'cfg-t1','t2':'cfg-t2','t3':'cfg-t3','t4':'cfg-t4','t5':'cfg-t5',
          'jobBonus':'cfg-job-bonus','raceBonus':'cfg-race-bonus',
          'statHi':'cfg-stat-hi','statMd':'cfg-stat-md','statLo':'cfg-stat-lo',
          'fGreat2':'cfg-f-great2','fGreat1':'cfg-f-great1','fHonor':'cfg-f-honor',
          'fMixed':'cfg-f-mixed','fFlee':'cfg-f-flee','fCaptured':'cfg-f-captured',
          'fMissing':'cfg-f-missing','fDead':'cfg-f-dead',
        };
        Object.entries(map).forEach(([key, id])=>{
          if(data[key] !== undefined){
            document.getElementById(id).value = data[key];
          }
        });
        showSettingsMsg('📂 読み込みました。「設定を適用」で反映されます', 'var(--accent2)');
      } catch(err){
        showSettingsMsg('⚠ 読み込み失敗: ファイルが正しくありません', '#ff7777');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function updateFameBar(){
  const val = document.getElementById('fame-val');
  const fill = document.getElementById('fame-fill');
  if(!val||!fill) return;
  val.textContent = (fame>=0?'+':'')+fame;
  // -100→0% , 0→50% , 正→50%超（上限なし、100%に近づくだけ）
  let pct;
  if(fame < 0){
    pct = Math.max(0, 50 + fame/2); // -100→0%, 0→50%
  } else {
    pct = Math.min(98, 50 + fame/Math.max(fame+100,100)*48);
  }
  fill.style.width = pct+'%';
  const color = fame >= 50 ? '#4fc97e' : fame >= 0 ? '#7c6fff' : fame >= -50 ? '#f0c040' : '#ff6b6b';
  fill.style.background = color;
  val.style.color = color;
}

initTroubles();
initSliders();
renderLog();
updateSendLabel();
updateFameBar();
</script>
